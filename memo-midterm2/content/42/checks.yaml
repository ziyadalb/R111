# أسئلة فهم سريعة: الحركة نفسها بأرقام جديدة، والجواب تحت السؤال مباشرة. متحقق منها في verify.py (المجموعة 22).
groups:
  - key: B
    title: 'الأساس'
    items:
      - id: b-1
        q: '$\sinh^{-1}x$ هي نفسها $\frac{1}{\sinh x}$؟'
        a: |
          لا. $\sinh^{-1}x$ هو الرقم اللي $\sinh$ له يساوي $x$ (ترجّعك). والمقلوب اسمه $\csch x$.
      - id: b-2
        q: 'وش لازم يكون داخل $\cosh^{-1}$؟ وداخل $\tanh^{-1}$؟'
        a: |
          $\cosh^{-1}$: الداخل $\ge1$. و$\tanh^{-1}$: الداخل بين $-1$ و$1$. عشان كذا $\tanh^{-1}\big(e^{5x}\big)$ يبي $x<0$.
      - id: b-3
        q: 'وش مشتقة $\cosh x$؟ ومشتقة $\sech x$؟'
        a: |
          $\sinh x$ بدون سالب، و$-\sech x\tanh x$ بسالب. هذول الفرقين الوحيدين عن المثلثية.
      - id: b-4
        q: 'أي خانة؟ $\int\frac{dx}{\sqrt{9+x^2}}$، و$\int\frac{dx}{9+x^2}$، و$\int\frac{dx}{\sqrt{9-x^2}}$'
        a: |
          $\sinh^{-1}\frac x3$ (جذر لحاله، جمع)، و$\frac13\tan^{-1}\frac x3$ (بدون جذر، جمع)، و$\sin^{-1}\frac x3$ (جذر لحاله، الثابت أول وطرح). وكلها $+C$.
      - id: b-5
        q: 'ليش $\int\frac{dx}{\sqrt{x^2+9}}$ ما فيها $\frac13$، و$\int\frac{dx}{x^2+9}$ فيها؟'
        a: |
          الجذر لحاله: الـ $a$ تنشطب. أي شكل ثاني (بدون جذر، أو $f$ برّا الجذر): يبقى $\frac1a$ قدام.

  - key: D1
    title: 'النمط 1'
    items:
      - id: d1-1
        q: 'مشتقة $\cosh\big(x^2\big)$؟'
        a: |
          $2x\sinh\big(x^2\big)$، بدون سالب.
      - id: d1-2
        q: 'مشتقة $\tanh^{-1}(3x)$؟ ومشتقة $\coth^{-1}(3x)$؟'
        a: |
          نفس الشي: $\frac{3}{1-9x^2}$. الفرق بس في الشرط: الأولى $|3x|<1$، والثانية $|3x|>1$.
      - id: d1-3
        q: 'مشتقة $\sech^{-1}(5x)$ بالاختصار؟'
        a: |
          $\frac{-1}{x\sqrt{1-25x^2}}$: الـ 5 تنشطب.

  - key: D2
    title: 'النمط 2'
    items:
      - id: d2-1
        q: 'مشتقة $\cosh^2(3x)$؟'
        a: |
          التربيع، بعده $\cosh$، بعده $3x$: $2\cosh3x\cdot\sinh3x\cdot3=6\sinh3x\cosh3x$.
      - id: d2-2
        q: 'مشتقة $\ln|\sinh2x|$؟'
        a: |
          $\frac{2\cosh2x}{\sinh2x}=2\coth2x$.
      - id: d2-3
        q: 'مشتقة $\log|\cosh x|$ (أساس 10)؟'
        a: |
          $\frac{\sinh x}{\cosh x\cdot\ln10}=\frac{\tanh x}{\ln10}$.

  - key: D3
    title: 'النمط 3'
    items:
      - id: d3-1
        q: 'اكتب $\csch^{-1}\frac1x$ و$\sech^{-1}\frac1x$ بدوال أسهل.'
        a: |
          $\sinh^{-1}x$ و$\cosh^{-1}x$ (الثانية لما $x\ge1$).
      - id: d3-2
        q: 'مشتقة $\csch^{-1}\frac3x$؟'
        a: |
          اقلب: $\sinh^{-1}\frac x3$، ومشتقته $\frac{\frac13}{\sqrt{1+\frac{x^2}{9}}}=\frac{1}{\sqrt{x^2+9}}$.

  - key: I1
    title: 'النمط 4'
    items:
      - id: i1-1
        q: 'كمّل المربع: $x^2-8x+20$'
        a: |
          القوس $(x-4)$، والثابت = القيمة عند $x=4$: $16-32+20=4$. يعني $(x-4)^2+4$.
      - id: i1-2
        q: 'كمّل المربع: $5+4x-x^2$'
        a: |
          القوس $(x-2)$، والثابت = القيمة عند $x=2$: $5+8-4=9$، والمربّع سالب: $9-(x-2)^2$.
      - id: i1-3
        q: '$\int\frac{dx}{\sqrt{x^2-8x+20}}$؟'
        a: |
          $(x-4)^2+2^2$ تحت جذر لحاله: $\sinh^{-1}\frac{x-4}{2}+C$.
      - id: i1-4
        q: '$\int\frac{dx}{\sqrt{5+4x-x^2}}$: زائدي؟'
        a: |
          لا. بعد الإكمال $3^2-(x-2)^2$ تحت جذر لحاله: $\sin^{-1}\frac{x-2}{3}+C$.

  - key: I2
    title: 'النمط 5'
    items:
      - id: i2-1
        q: '$\int\frac{dx}{(x+1)\sqrt{x^2+2x+5}}$؟'
        a: |
          $x^2+2x+5=(x+1)^2+2^2$، و$f=x+1$ برّا الجذر، وجمع: $-\frac12\csch^{-1}\frac{|x+1|}{2}+C$.
      - id: i2-2
        q: 'بعد الإكمال، متى $\sech^{-1}$ ومتى $\csch^{-1}$؟'
        a: |
          تحت الجذر $a^2-f^2$ (طرح): $\sech^{-1}$. و$a^2+f^2$ (جمع): $\csch^{-1}$.

  - key: I3
    title: 'النمط 6'
    items:
      - id: i3-1
        q: '$\int\frac{e^x}{\sqrt{e^{2x}+4}}\,dx$؟'
        a: |
          $f=e^x$ ومشتقته $e^x$ موجودة فوق، وجذر لحاله وجمع: $\sinh^{-1}\frac{e^x}{2}+C$.
      - id: i3-2
        q: '$\int\frac{\cos x}{9-\sin^2x}\,dx$؟'
        a: |
          $f=\sin x$ ومشتقته فوق، وبدون جذر و$a^2-f^2$، و$|\sin x|<3$ دايم: $\frac13\tanh^{-1}\frac{\sin x}{3}+C$.
      - id: i3-3
        q: '$\int\frac{2x}{\sqrt{x^4+1}}\,dx$؟'
        a: |
          $f=x^2$ ومشتقته $2x$ موجودة: $\sinh^{-1}\big(x^2\big)+C$.

  - key: I4
    title: 'النمط 7'
    items:
      - id: i4-1
        q: '$\int\frac{dx}{\sqrt{e^{2x}+9}}$؟'
        a: |
          اضرب فوق وتحت في $e^x$: $f=e^x$ برّا الجذر، وجمع، و$a=3$: $-\frac13\csch^{-1}\frac{e^x}{3}+C$.
      - id: i4-2
        q: '$\int\frac{dx}{x\sqrt{1-x^4}}$؟'
        a: |
          اضرب فوق وتحت في $x$: $\frac12\cdot\frac{2x}{x^2\sqrt{1-\big(x^2\big)^2}}$، و$f=x^2$ موجب: $-\frac12\sech^{-1}\big(x^2\big)+C$.

  - key: H
    title: 'النمط 8'
    items:
      - id: h-1
        q: '$\int\sinh(5x)\,dx$؟'
        a: |
          $\frac15\cosh(5x)+C$، بدون سالب (عكس $\sin$).
      - id: h-2
        q: '$\int x\sech^2\big(x^2\big)\,dx$؟'
        a: |
          الداخل $x^2$ ومشتقته $2x$، والموجود نصها: $\frac12\tanh\big(x^2\big)+C$.
      - id: h-3
        q: '$\int\frac{\sinh x}{\cosh^2x}\,dx$؟'
        a: |
          $f=\cosh x$ ومشتقته $\sinh x$ فوق، يعني $\int f^{-2}f'\,dx=-f^{-1}$: $-\sech x+C$.
      - id: h-4
        q: '$\int\coth x\,dx$؟'
        a: |
          $\coth=\frac{\cosh}{\sinh}$، والبسط مشتقة المقام: $\ln|\sinh x|+C$.
