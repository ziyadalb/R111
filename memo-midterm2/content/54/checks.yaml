# أسئلة فهم سريعة: تدريب على الحيل نفسها، بأرقام جديدة. الجواب تحت السؤال مباشرة.
groups:
  - key: B
    title: 'الأساس'
    items:
      - id: b-1
        q: 'وش القالب لكل واحد: $\frac{x+5}{(x-1)(x+2)}$ و$\frac{1}{x^2(x+3)}$ و$\frac{x}{(x-1)\big(x^2+4\big)}$؟'
        a: |
          $$\frac{A}{x-1}+\frac{B}{x+2},\qquad\frac Ax+\frac B{x^2}+\frac C{x+3},\qquad\frac{A}{x-1}+\frac{Bx+C}{x^2+4}$$
          الخطي فوقه ثابت، والمكرر له حد لكل قوة، والتربيعي اللي ما يتحلل فوقه خطي.
      - id: b-2
        q: 'طلّع $A$ و$B$ بالتغطية: $\frac{x+5}{(x-1)(x+2)}=\frac{A}{x-1}+\frac{B}{x+2}$.'
        a: |
          غطّ $(x-1)$ وعوّض $x=1$: $A=\frac{6}{3}=2$. وغطّ $(x+2)$ وعوّض $x=-2$: $B=\frac{3}{-3}=-1$.
      - id: b-3
        q: '$\int\frac{3}{x+2}\,dx$ و$\int\frac{4}{(x-1)^2}\,dx$؟'
        a: |
          $3\ln|x+2|+C$. والثاني بالقوة العكسية: $4\cdot\frac{(x-1)^{-1}}{-1}=-\frac{4}{x-1}+C$.
      - id: b-4
        q: '$\int\frac{x}{x^2+9}\,dx$ و$\int\frac{5}{x^2+9}\,dx$؟'
        a: |
          الأول بسطه نص مشتقة المقام: $\frac12\ln\big(x^2+9\big)+C$. والثاني $\tan^{-1}$ مع $a=3$: $\frac53\tan^{-1}\frac x3+C$.
      - id: b-5
        q: 'متى لازم تقسم قبل الكسور؟'
        a: |
          لما درجة البسط تساوي أو أكبر من درجة المقام. القسمة تطلّع لك كثير حدود + كسر بسطه أصغر، وبعدين تفكّك الكسر.

  - key: K1
    title: 'النمط 1'
    items:
      - id: k1-1
        q: 'بالاختصار: $\frac{2x^2+3x+18}{x\big(x^2+9\big)}$، وش $A$ و$B$ و$D$؟'
        a: |
          $p=2$ و$q=3$ و$r=18$ و$a^2=9$: $A=\frac{18}{9}=2$، و$D=3$، و$B=2-2=0$.
      - id: k1-2
        q: 'ليش فوق $x^2+4$ نحط $Bx+D$ مو رقم بس؟'
        a: |
          لأن البسط فوق كل عامل يكون أقل منه بدرجة. $x^2+4$ درجته 2، فبسطه درجة 1: $Bx+D$. ولو حطيت رقم بس، ما تقدر تطلّع البسط الأصلي في كل الحالات.

  - key: K2
    title: 'النمط 2'
    items:
      - id: k2-1
        q: 'القالب لـ $\frac{3x+1}{x^2(x-1)}$؟ وطلّع الثوابت.'
        a: |
          $\frac Ax+\frac B{x^2}+\frac C{x-1}$. بالتغطية: $B$ عند $x=0$ يطلع $\frac{1}{-1}=-1$، و$C$ عند $x=1$ يطلع $\frac41=4$. ومعامل $x^2$: $A+C=0$، يعني $A=-4$.
      - id: k2-2
        q: '$\int\frac{dx}{(x+1)^2}$؟'
        a: |
          بالقوة العكسية: $\frac{(x+1)^{-1}}{-1}=-\frac{1}{x+1}+C$.

  - key: K3
    title: 'النمط 3'
    items:
      - id: k3-1
        q: 'حلّل $x^2-x-6$.'
        a: |
          رقمين ضربهم $-6$ وجمعهم $-1$: $-3$ و$2$. يعني $(x-3)(x+2)$.
      - id: k3-2
        q: 'بالتغطية: $\frac{5x-1}{(x-1)(x+1)}$؟'
        a: |
          عند $x=1$: $\frac{4}{2}=2$. وعند $x=-1$: $\frac{-6}{-2}=3$. يعني $\frac{2}{x-1}+\frac{3}{x+1}$.

  - key: K4
    title: 'النمط 4'
    items:
      - id: k4-1
        q: '$\frac{1}{\big(x^2+1\big)\big(x^2+9\big)}$: اعتبر $x^2=t$ وطلّع الكسور.'
        a: |
          $\frac{1}{(t+1)(t+9)}$: عند $t=-1$ يطلع $\frac18$، وعند $t=-9$ يطلع $-\frac18$:
          $$\frac{1}{\big(x^2+1\big)\big(x^2+9\big)}=\frac{1/8}{x^2+1}-\frac{1/8}{x^2+9}$$
      - id: k4-2
        q: 'متى تنفع حيلة $x^2=t$؟'
        a: |
          لما كل الـ $x$ في البسط والمقام تجي مربّعة ($x^2$ أو $x^4$)، وما فيه $x$ لحاله.
