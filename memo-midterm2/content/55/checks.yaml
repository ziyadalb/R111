# أسئلة فهم سريعة: تدريب على الحركات نفسها، بأرقام جديدة. الجواب تحت السؤال مباشرة.
groups:
  - key: B
    title: 'الأساس'
    items:
      - id: b-1
        q: 'وش $n$ في $\int\frac{dx}{x^{1/3}+x^{1/4}}$؟ ووش يصير كل أس؟'
        a: |
          المقامات 3 و4، والمضاعف المشترك 12: $x=t^{12}$. فـ $x^{1/3}=t^4$ و$x^{1/4}=t^3$، و$dx=12t^{11}\,dt$.
      - id: b-2
        q: 'لو $x=t^6$: وش $dx$؟ ووش $\sqrt x$ و$\sqrt[3]x$؟'
        a: |
          $dx=6t^5\,dt$، و$\sqrt x=t^3$، و$\sqrt[3]x=t^2$.
      - id: b-3
        q: 'بالقسمة المتناوبة: $\frac{t^2}{t+1}$؟'
        a: |
          $t-1+\frac{1}{t+1}$. تأكد بالضرب: $(t+1)(t-1)+1=t^2$.
      - id: b-4
        q: 'رجّع لـ $x$: $t^4$ لما $t=x^{1/6}$.'
        a: |
          $t^4=x^{4/6}=x^{2/3}$. بسّط الكسر دايم.
      - id: b-5
        q: '$\int\frac{\sqrt[3]{1+\sqrt x}}{\sqrt x}\,dx$: تحتاج تبديل؟'
        a: |
          لا. $\frac{1}{2\sqrt x}$ مشتقة $1+\sqrt x$ وموجودة، فالقوة العكسية مباشرة:
          $$2\cdot\frac{\big(1+\sqrt x\big)^{4/3}}{4/3}=\frac32\big(1+\sqrt x\big)^{4/3}+C$$

  - key: H1
    title: 'النمط 1'
    items:
      - id: h1-1
        q: 'وش يطلع بعد التبديل في $\int\frac{dx}{x^{1/3}+x^{2/3}}$؟ وكامله.'
        a: |
          $n=3$: $x=t^3$ و$dx=3t^2\,dt$:
          $$\int\frac{3t^2\,dt}{t+t^2}=3\int\frac{t}{t+1}\,dt=3t-3\ln(t+1)+C,\qquad t=\sqrt[3]x$$
      - id: h1-2
        q: 'بالقسمة: $\frac{t^3}{t^2+1}$؟'
        a: |
          $t-\frac{t}{t^2+1}$، لأن $t^3=t\big(t^2+1\big)-t$. وتكامله $\frac{t^2}{2}-\frac12\ln\big(t^2+1\big)$.

  - key: H2
    title: 'النمط 2'
    items:
      - id: h2-1
        q: 'لو $t=\sqrt{5+\sqrt x}$: طلّع $x$ و$dx$.'
        a: |
          $t^2=5+\sqrt x$، يعني $\sqrt x=t^2-5$، يعني $x=\big(t^2-5\big)^2$. و$dx=2\big(t^2-5\big)\cdot2t\,dt=4t\big(t^2-5\big)dt$.
      - id: h2-2
        q: 'ليش ما نبدّل $t=\sqrt x$ بس في $\int\frac{dx}{\sqrt{4+\sqrt x}}$؟'
        a: |
          لأن يبقى عندك $\sqrt{4+t}$، جذر ثاني لازم تبدّله بعد. لما تبدّل الجذر الخارجي كله، يروح الجذرين مرة وحدة.

  - key: H3
    title: 'النمط 3'
    items:
      - id: h3-1
        q: 'لو $t=\sqrt{e^x+3}$: طلّع $x$ و$dx$.'
        a: |
          $e^x=t^2-3$، يعني $x=\ln\big(t^2-3\big)$، و$dx=\frac{2t}{t^2-3}\,dt$.
