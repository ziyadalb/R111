# أسئلة 5.5 اللي جات في الاختبارات النهائية (1445 إلى 1447)
# جات في F451 وF452 وF461 بس. والصفحة: صفحة الـ PDF في ملف النماذج.
section: '5.5'
slug: fin55
title: 'تعويضات النهائيات'
patterns:
  - key: FIN
    questions:
      - id: F451-2-5
        marks: 2
        page: 13
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{x}+\sqrt[3]{x}}'
        solution: |
          1. $\sqrt x=x^{1/2}$ و$\sqrt[3]x=x^{1/3}$: المقامات 2 و3، والمضاعف المشترك 6:
             $$x=t^6,\qquad dx=6t^5\,dt,\qquad\sqrt x=t^3,\qquad\sqrt[3]x=t^2$$
          2. نعوّض، ونطلّع أصغر قوة ($t^2$) عامل مشترك ونشطبها:
             $$\int\frac{6t^5\,dt}{t^3+t^2}=6\int\frac{t^3}{t+1}\,dt$$
          3. القسمة المتناوبة: قوى $t$ تنزل بإشارات $+\,-\,+$، والباقي $-\frac{1}{t+1}$ لأن الأس 3 فردي (تتأكد بالضرب):
             $$\frac{t^3}{t+1}=t^2-t+1-\frac{1}{t+1}$$
          4. نكامل:
             $$6\Big(\frac{t^3}{3}-\frac{t^2}{2}+t-\ln(t+1)\Big)=2t^3-3t^2+6t-6\ln(t+1)$$
          5. نرجع: $t=\sqrt[6]x$، و$t^2=\sqrt[3]x$، و$t^3=\sqrt x$:
        answer: |-
          2\sqrt{x}-3\sqrt[3]{x}+6\sqrt[6]{x}-6\ln\big(1+\sqrt[6]{x}\big)+C
        domain: 'x>0'
        fix: |
          المفتاح كتب في آخر سطرين $\ln|u-1|$ و$\ln|x^{1/6}-1|$، والصحيح $\ln(u+1)$ و$\ln(x^{1/6}+1)$. يعني الجواب النهائي في المفتاح غلط في هالحد.
        note: |
          ونفسه مثال 1 فقرة 1 في المذكرة (ص88).
        check:
          kind: indef
          f: '1/(sqrt(x)+x**Rational(1,3))'
          ans: '2*sqrt(x) - 3*x**Rational(1,3) + 6*x**Rational(1,6) - 6*log(1+x**Rational(1,6))'
          samples: [0.2, 1.0, 5.0]
          identities:
            - ['x**3/(x+1)', 'x**2-x+1-1/(x+1)']
          key_wrong: '2*sqrt(x) - 3*x**Rational(1,3) + 6*x**Rational(1,6) - 6*log(Abs(x**Rational(1,6)-1))'
          key_invalid_on: [0.2, 2.0, 5.0]

      - id: F452-2-5
        marks: 2
        page: 28
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{x+\sqrt[3]{x}}'
        solution: |
          1. الأسس: $x=x^1$ و$\sqrt[3]x=x^{1/3}$. المقامات 1 و3، فـ $n=3$. و$\sqrt[3]x$ معرّف للسالب كمان، فـ $t$ ممكن يكون سالب:
             $$x=t^3,\qquad dx=3t^2\,dt,\qquad\sqrt[3]x=t$$
          2. نعوّض، ونطلّع $t$ عامل مشترك ونشطبه:
             $$\int\frac{3t^2\,dt}{t^3+t}=3\int\frac{t}{t^2+1}\,dt$$
          3. هنا المقام $t^2+1$، وبسطه $t$ نص مشتقته ($2t$). فتكامله $\ln$ مباشرة، بدون قسمة:
             $$3\cdot\frac12\ln\big(t^2+1\big)=\frac32\ln\big(t^2+1\big)$$
          4. نرجع: $t^2=x^{2/3}$:
        answer: |-
          \frac32\ln\big(x^{2/3}+1\big)+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: '1/(x+sign(x)*Abs(x)**Rational(1,3))'
          ans: 'Rational(3,2)*log((x**2)**Rational(1,3) + 1)'
          samples: [-3.0, -0.5, 0.5, 3.0]

      - id: F461-2-5
        marks: 2
        page: 12
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{x}\,(1+x)}'
        solution: |
          1. **قبل أي تبديل:** فيه $\sqrt x$ تحت، و$\frac{1}{2\sqrt x}$ هي مشتقة $\sqrt x$. ونكتب $x=\big(\sqrt x\big)^2$:
             $$\frac{1}{\sqrt x\,(1+x)}=2\cdot\frac{\frac{1}{2\sqrt x}}{1+\big(\sqrt x\big)^2}$$
          2. صار بالشكل $\frac{f'}{1+f^2}$ مع $f=\sqrt x$، وتكامله $\tan^{-1}f$ مباشرة. تأكد: اشتق $2\tan^{-1}\sqrt x$ يطلع $2\cdot\frac{1}{1+x}\cdot\frac{1}{2\sqrt x}$، يعني السؤال:
             $$2\tan^{-1}\sqrt x$$
        answer: |-
          2\tan^{-1}\sqrt{x}+C
        domain: 'x>0'
        note: |
          المفتاح سواها بتبديل $u=\sqrt x$ ($x=u^2$ و$dx=2u\,du$)، وطلع نفس الجواب. والطريقتين صح.
        check:
          kind: indef
          f: '1/(sqrt(x)*(1+x))'
          ans: '2*atan(sqrt(x))'
          samples: [0.2, 1.0, 5.0]
