# أسئلة فهم سريعة: تدريب على الحيل نفسها، بأرقام جديدة. الجواب تحت السؤال مباشرة.
groups:
  - key: B
    title: 'الأساس'
    items:
      - id: b-1
        q: '$\int\sin^6x\cos x\,dx$؟'
        a: |
          $\cos x$ هي مشتقة $\sin x$، وموجودة. زد الأس واقسم عليه: $\frac{\sin^7x}{7}+C$.
      - id: b-2
        q: '$\int\cos^3x\sin x\,dx$؟'
        a: |
          مشتقة $\cos x$ هي $-\sin x$، فالجواب ياخذ سالب: $-\frac{\cos^4x}{4}+C$.
      - id: b-3
        q: '$\int\frac{x}{x^2+4}\,dx$؟'
        a: |
          مشتقة المقام $2x$. خمّن $\ln(x^2+4)$: مشتقته $\frac{2x}{x^2+4}$، ضعف اللي نبي. فالجواب $\frac12\ln\big(x^2+4\big)+C$.
      - id: b-4
        q: '$\int e^{-3x}\,dx$ و$\int\sin4x\,dx$؟'
        a: |
          الداخل خطي، فاقسم على معامل $x$: $-\frac{e^{-3x}}{3}+C$ و$-\frac{\cos4x}{4}+C$.
      - id: b-5
        q: 'في $\int x^2\ln x\,dx$: وش تشتق ووش تكامل؟ وليش؟'
        a: |
          تشتق $\ln x$، لأن مشتقته $\frac1x$ تمسحه. وتكامل $x^2$. لو عكست، بتحتاج تكامل $\ln x$ وهو أصعب.

  - key: P1
    title: 'النمط 1'
    items:
      - id: p1-1
        q: 'اكتب جدول $\int(5x+2)\sin x\,dx$، وطلّع الجواب.'
        a: |
          @di 5x+2 & \sin x ;; 5 & -\cos x ;; 0 & -\sin x
          $$+\,(5x+2)(-\cos x)\;-\;5\,(-\sin x)=-(5x+2)\cos x+5\sin x+C$$
      - id: p1-2
        q: 'كم صف تحتاج في جدول $\int x^3\cos x\,dx$؟'
        a: |
          خمس صفوف في «نشتق»: $x^3$ ثم $3x^2$ ثم $6x$ ثم $6$ ثم $0$. يعني أربع أقطار.

  - key: P2
    title: 'النمط 2'
    items:
      - id: p2-1
        q: 'بالاختصار: $\int x^4\ln x\,dx$؟'
        a: |
          $n=4$، فالأس الجديد 5: $\frac{x^5}{5}\ln x-\frac{x^5}{25}+C$.
      - id: p2-2
        q: 'ليش ما نكمل جدول $\ln$ لين صفر؟'
        a: |
          لأن مشتقات $\frac1x$ ما توصل صفر أبد ($-\frac{1}{x^2}$ ثم $\frac{2}{x^3}$...). نوقف أول ما يصير ضرب الصف سهل، وهذا يصير في الصف الثاني.

  - key: P3
    title: 'النمط 3'
    items:
      - id: p3-1
        q: 'مشتقة $\sin^{-1}x$ و$\tanh^{-1}x$ و$\cosh^{-1}x$؟'
        a: |
          $\frac{1}{\sqrt{1-x^2}}$ و$\frac{1}{1-x^2}$ و$\frac{1}{\sqrt{x^2-1}}$. هذي تحطها في الصف الثاني من عمود «نشتق».
      - id: p3-2
        q: 'بالتخمين: $\int\frac{x}{\sqrt{x^2+1}}\,dx$؟'
        a: |
          خمّن $\sqrt{x^2+1}$: مشتقته $\frac{2x}{2\sqrt{x^2+1}}=\frac{x}{\sqrt{x^2+1}}$، نفس اللي نبي. فالجواب $\sqrt{x^2+1}+C$.

  - key: P4
    title: 'النمط 4'
    items:
      - id: p4-1
        q: 'اكتب $\cosh4x$ و$\sinh4x$ بالأسّيات.'
        a: |
          $$\cosh4x=\frac{e^{4x}+e^{-4x}}{2},\qquad\sinh4x=\frac{e^{4x}-e^{-4x}}{2}$$
      - id: p4-2
        q: '$\int e^{3x}\sinh x\,dx$؟'
        a: |
          $e^{3x}\cdot\frac{e^x-e^{-x}}{2}=\frac12e^{4x}-\frac12e^{2x}$، وتكامله $\frac{e^{4x}}{8}-\frac{e^{2x}}{4}+C$.

  - key: P5
    title: 'النمط 5'
    items:
      - id: p5-1
        q: 'في الدوّارة: متى توقف الجدول؟'
        a: |
          في الصف الثالث، لما ضرب الصف يرجع نفس السؤال مضروب في رقم. بعدها تنقل $I$ لليسار وتحل.
      - id: p5-2
        q: 'بالاختصار: $\int e^x\sin2x\,dx$؟'
        a: |
          $a=1$ و$b=2$: $\frac{e^x\big(\sin2x-2\cos2x\big)}{5}+C$.

  - key: Q1
    title: 'النمط 6'
    items:
      - id: q1-1
        q: '$\int\sin^3x\cos^2x\,dx$: وش تحجز؟ ووش الجواب؟'
        a: |
          $\sin$ هي الفردية: احجز $\sin x$، و$\sin^2x=1-\cos^2x$. يصير $\big(\cos^2x-\cos^4x\big)\sin x$، والجواب بسالب: $-\frac{\cos^3x}{3}+\frac{\cos^5x}{5}+C$.
      - id: q1-2
        q: 'القوتين فرديتين ($\sin^3x\cos^7x$): من وين تحجز؟'
        a: |
          من الأصغر ($\sin^3x$): احجز $\sin x$، والقوس اللي تفكه $\big(1-\cos^2x\big)$ بس.

  - key: Q2
    title: 'النمط 7'
    items:
      - id: q2-1
        q: '$\int\tan^5x\sec^2x\,dx$؟'
        a: |
          $\sec^2x$ مشتقة $\tan x$ وموجودة: $\frac{\tan^6x}{6}+C$.
      - id: q2-2
        q: '$\int\tan x\sec^3x\,dx$؟'
        a: |
          احجز $\sec x\tan x$، يبقى $\sec^2x$: $\int\sec^2x\,\big(\sec x\tan x\big)\,dx=\frac{\sec^3x}{3}+C$.
      - id: q2-3
        q: 'مشتقة $\cot x$ و$\csc x$؟'
        a: |
          $-\csc^2x$ و$-\csc x\cot x$. عشان كذا أجوبة $\cot$ و$\csc$ فيها سالب.
