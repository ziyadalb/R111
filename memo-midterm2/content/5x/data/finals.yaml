# أسئلة 5.1 و5.2 اللي جات في الاختبارات النهائية (1445 إلى 1447)
# المعرف: F + السنة والفصل + السؤال + الفقرة (F471-2-2 = نهائي 1447 الفصل الأول، السؤال 2 فقرة 2)
