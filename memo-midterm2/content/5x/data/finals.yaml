# أسئلة 5.1 و5.2 اللي جات في الاختبارات النهائية (1445 إلى 1447)، وأسئلة «أسّية × زائدية» من الفصلي
# المعرف: F + السنة والفصل + السؤال + الفقرة (F471-2-2 = نهائي 1447 الفصل الأول، السؤال 2 فقرة 2)
# نهائي 1445 الفصل الثاني (F452-2-2) نفس M462-2-8 بالضبط: ∫tan⁻¹x dx.
section: '5.x'
slug: fin
title: 'أسئلة النهائيات'
patterns:
  - key: FIN
    questions:
      - id: F471-2-2
        marks: 3
        page: 10
        prompt: 'Evaluate the integral.'
        q: '\int x^2\cos(3x)\,dx'
        solution: |
          1. كثير حدود من الدرجة الثانية × $\cos3x$: نشتق $x^2$ لين يصير صفر (ثلاث مرات)، ونكامل $\cos3x$. والداخل خطي ($3x$)، فكل تكامل نقسم على 3:
             @di x^2 & \cos3x ;; 2x & \frac13\sin3x ;; 2 & -\frac19\cos3x ;; 0 & -\frac1{27}\sin3x
          2. نضرب قطريًا بالإشارات $+\,-\,+$:
             $$+\,x^2\cdot\frac13\sin3x\;-\;2x\cdot\Big(-\frac19\cos3x\Big)\;+\;2\cdot\Big(-\frac1{27}\sin3x\Big)$$
          3. نرتّب الإشارات (ناقص في ناقص يصير زائد):
             $$\frac{x^2}{3}\sin3x+\frac{2x}{9}\cos3x-\frac{2}{27}\sin3x$$
        answer: |-
          \frac{x^2}{3}\sin3x+\frac{2x}{9}\cos3x-\frac{2}{27}\sin3x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'x**2*cos(3*x)'
          ans: 'x**2/3*sin(3*x) + 2*x/9*cos(3*x) - Rational(2,27)*sin(3*x)'
          samples: [-2.0, 0.5, 3.0]

      - id: F451-2-2
        marks: 3
        page: 11
        prompt: 'Evaluate the integral.'
        q: '\int x^2\cosh x\,dx'
        solution: |
          1. نفس F471-2-2 مع $\cosh x$: نشتق $x^2$ لين صفر، ونكامل $\cosh x$. تكاملها $\sinh x$، وتكامل $\sinh x$ هو $\cosh x$، بدون سالب:
             @di x^2 & \cosh x ;; 2x & \sinh x ;; 2 & \cosh x ;; 0 & \sinh x
          2. نضرب قطريًا بالإشارات $+\,-\,+$:
             $$x^2\sinh x-2x\cosh x+2\sinh x$$
        answer: |-
          x^2\sinh x-2x\cosh x+2\sinh x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'x**2*cosh(x)'
          ans: 'x**2*sinh(x) - 2*x*cosh(x) + 2*sinh(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: F461-2-2
        marks: 3
        page: 11
        prompt: 'Evaluate the integral.'
        q: '\int x^{-3}\ln|x|\,dx'
        solution: |
          1. قوة × $\ln$: نشتق $\ln|x|$، ونكامل $x^{-3}$ (الأس يصير $-2$ ونقسم عليه)، ونوقف في الصف الثاني:
             @di \ln|x| & x^{-3} ;; !\frac1x & -\frac{1}{2x^2}
          2. القطر، ناقص تكامل ضرب الصف الأخير ($-\frac{1}{2x^3}$). وناقص في ناقص يصير زائد:
             $$-\frac{\ln|x|}{2x^2}+\frac12\int x^{-3}\,dx$$
          3. و$\int x^{-3}dx=\frac{x^{-2}}{-2}=-\frac{1}{2x^2}$:
             $$-\frac{\ln|x|}{2x^2}-\frac{1}{4x^2}$$
        answer: |-
          -\frac{\ln|x|}{2x^2}-\frac{1}{4x^2}+C
        domain: 'x\ne0'
        fix: |
          المفتاح كتب $\ln x$ بدل $\ln|x|$، وهذا يصح بس لما $x>0$. السؤال فيه قيمة مطلقة، فالجواب يبيها.
        check:
          kind: indef
          f: 'log(Abs(x))/x**3'
          ans: '-log(Abs(x))/(2*x**2) - 1/(4*x**2)'
          samples: [-2.0, -0.5, 0.5, 2.0]
          key_wrong: '-log(x)/(2*x**2) - 1/(4*x**2)'
          key_valid_on: [0.5, 2.0]
          key_invalid_on: [-2.0, -0.5]

      - id: F462-2-2
        marks: 3
        page: 26
        prompt: 'Evaluate the integral.'
        q: '\int x\tanh^{-1}x\,dx'
        solution: |
          1. دالة عكسية × $x$: نشتق $\tanh^{-1}x$ (مشتقتها $\frac{1}{1-x^2}$)، ونكامل $x$:
             @di \tanh^{-1}x & x ;; !\frac{1}{1-x^2} & \frac{x^2}{2}
          2. القطر، ناقص تكامل ضرب الصف الأخير:
             $$\frac{x^2}{2}\tanh^{-1}x-\frac12\int\frac{x^2}{1-x^2}\,dx$$
          3. الباقي ما ينحل بالتخمين، لأن درجة البسط نفس المقام. الحيلة: نكتب البسط بدلالة المقام (نضيف 1 ونطرحه):
             $$\frac{x^2}{1-x^2}=\frac{-(1-x^2)+1}{1-x^2}=-1+\frac{1}{1-x^2}$$
          4. نكامل. و$\int\frac{dx}{1-x^2}=\tanh^{-1}x$ لأن $|x|<1$:
             $$\frac{x^2}{2}\tanh^{-1}x-\frac12\big(-x+\tanh^{-1}x\big)$$
          5. نجمع حدّي $\tanh^{-1}x$: $\frac{x^2}{2}-\frac12=\frac{x^2-1}{2}$:
        answer: |-
          \frac{x^2-1}{2}\tanh^{-1}x+\frac x2+C
        domain: '|x|<1'
        check:
          kind: indef
          f: 'x*atanh(x)'
          ans: '(x**2-1)/2*atanh(x) + x/2'
          samples: [-0.8, 0.2, 0.9]

      - id: F472-2-3
        marks: 3
        page: 25
        prompt: 'Evaluate the integral.'
        q: '\int e^{2x}\sin x\,dx'
        solution: |
          1. **وش النمط؟** أسّية × $\sin$. الثنتين ما تختفي بالاشتقاق، ومشتقاتهم تدوّر. فنجزّئ لين يرجع نفس السؤال، ونحله كمعادلة.
          2. **الجدول:** نشتق $\sin x$، ونكامل $e^{2x}$ (كل تكامل نقسم على 2). ونوقف في الصف الثالث لأن ضربه $(-\sin x)\cdot\frac14e^{2x}$ رجع نفس السؤال مضروب في رقم:
             @di \sin x & e^{2x} ;; \cos x & \frac12e^{2x} ;; !-\sin x & \frac14e^{2x}
          3. نسمّي السؤال $I$. نأخذ القطرين بإشاراتهم، وبعدهم تكامل ضرب الصف الأخير بإشارته ($+$):
             $$I=\frac12e^{2x}\sin x-\frac14e^{2x}\cos x+\int\Big(-\frac14e^{2x}\sin x\Big)dx$$
          4. التكامل الأخير هو $-\frac14I$. ننقله لليسار: $I+\frac14I=\frac54I$:
             $$\frac54I=\frac12e^{2x}\sin x-\frac14e^{2x}\cos x$$
          5. نضرب الطرفين في $\frac45$:
             $$I=\frac25e^{2x}\sin x-\frac15e^{2x}\cos x$$
        answer: |-
          \frac{e^{2x}}{5}\big(2\sin x-\cos x\big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(2*x)*sin(x)'
          ans: 'exp(2*x)/5*(2*sin(x) - cos(x))'
          samples: [-1.0, 0.5, 2.0]

      - id: F471-2-6
        marks: 2
        page: 12
        prompt: 'Evaluate the integral.'
        q: '\int\tan^3x\,\sec^2x\,dx'
        solution: |
          1. $\sec^2x$ هي مشتقة $\tan x$، وموجودة جاهزة جنب $\tan^3x$. فما نحتاج نحجز ولا نحوّل: القوة العكسية مباشرة، نزيد الأس واحد ونقسم عليه:
             $$\int\tan^3x\,\big(\sec^2x\,dx\big)=\frac{\tan^4x}{4}$$
        answer: |-
          \frac{\tan^4x}{4}+C
        domain: '\cos x\ne0'
        note: |
          مفتاح الاختبار نفسه حلها كذا بسطر واحد، بدون $u$.
        check:
          kind: indef
          f: 'tan(x)**3*sec(x)**2'
          ans: 'tan(x)**4/4'
          samples: [-1.0, 0.3, 1.2, 2.5]

      - id: F452-2-6
        marks: 2
        page: 29
        prompt: 'Evaluate the integral.'
        q: '\int\sin^5x\,\cos^6x\,dx'
        solution: |
          1. هنا $\sin$ هي الفردية (5)، فنحجز $\sin x$، ونحوّل الباقي لـ $\cos$ بـ $\sin^2x=1-\cos^2x$:
             $$\sin^5x\cos^6x=\big(1-\cos^2x\big)^2\cos^6x\,\sin x$$
          2. نفك القوس ونضرب في $\cos^6x$:
             $$=\big(\cos^6x-2\cos^8x+\cos^{10}x\big)\sin x$$
          3. القوة العكسية، بس **بسالب**: مشتقة $\cos x$ هي $-\sin x$، فـ $\int\cos^kx\sin x\,dx=-\frac{\cos^{k+1}x}{k+1}$:
             $$-\frac{\cos^7x}{7}+\frac{2\cos^9x}{9}-\frac{\cos^{11}x}{11}$$
        answer: |-
          -\frac{\cos^7x}{7}+\frac{2\cos^9x}{9}-\frac{\cos^{11}x}{11}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)**5*cos(x)**6'
          ans: '-cos(x)**7/7 + 2*cos(x)**9/9 - cos(x)**11/11'
          samples: [-1.0, 0.4, 2.0, 4.5]

      - id: M451-2-1
        marks: 2
        page: 5
        prompt: 'Evaluate the integral.'
        q: '\int e^{-x}\cosh x\,dx'
        solution: |
          1. أسّية × $\cosh$: ما نجزّئ. $\cosh$ أصلًا أسّيات، فنكتبها بالتعريف:
             $$\cosh x=\frac{e^x+e^{-x}}{2}$$
          2. نضرب في $e^{-x}$، والأسس تنجمع: $e^{-x}e^{x}=e^0=1$ و$e^{-x}e^{-x}=e^{-2x}$:
             $$e^{-x}\cosh x=\frac12+\frac12e^{-2x}$$
          3. نكامل كل حد: الثابت تكامله $x$، و$\int e^{kx}dx=\frac{e^{kx}}{k}$ (نقسم على $-2$):
             $$\frac x2+\frac12\cdot\frac{e^{-2x}}{-2}$$
        answer: |-
          \frac x2-\frac{e^{-2x}}{4}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(-x)*cosh(x)'
          ans: 'x/2 - exp(-2*x)/4'
          samples: [-1.0, 0.5, 2.0]

      - id: M461-2-3
        marks: 2
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int e^{x}\cosh2x\,dx'
        solution: |
          1. أسّية × $\cosh$: نكتب $\cosh2x$ بالتعريف (فيه جمع):
             $$\cosh2x=\frac{e^{2x}+e^{-2x}}{2}$$
          2. نضرب في $e^x$، والأسس تنجمع ($1+2=3$ و$1-2=-1$):
             $$e^x\cosh2x=\frac12e^{3x}+\frac12e^{-x}$$
          3. نكامل كل حد ($\int e^{kx}dx=\frac{e^{kx}}{k}$):
             $$\frac12\cdot\frac{e^{3x}}{3}+\frac12\cdot\frac{e^{-x}}{-1}$$
        answer: |-
          \frac{e^{3x}}{6}-\frac{e^{-x}}{2}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(x)*cosh(2*x)'
          ans: 'exp(3*x)/6 - exp(-x)/2'
          samples: [-1.0, 0.5, 2.0]

      - id: M462-2-5
        marks: 2
        page: 22
        prompt: 'Evaluate the integral.'
        q: '\int e^{x/2}\sinh3x\,dx'
        solution: |
          1. **وش النمط؟** أسّية × $\sinh$. تقدر تجزّئ، بس فيه طريق أقصر بكثير: $\sinh$ أصلًا أسّيات. نكتبها بالتعريف (فيه طرح):
             $$\sinh3x=\frac{e^{3x}-e^{-3x}}{2}$$
          2. **نضرب في $e^{x/2}$.** الأسس تنجمع: $\frac12+3=\frac72$ و$\frac12-3=-\frac52$. وصار عندنا أسّيات بس:
             $$e^{x/2}\sinh3x=\frac12e^{7x/2}-\frac12e^{-5x/2}$$
          3. **نكامل كل حد:** $\int e^{kx}dx=\frac{e^{kx}}{k}$. والقسمة على $\frac72$ = الضرب في $\frac27$:
             $$\frac12\cdot\frac27e^{7x/2}-\frac12\cdot\Big(-\frac25\Big)e^{-5x/2}$$
          4. نبسّط: $\frac12\cdot\frac27=\frac17$، وناقص في ناقص يصير زائد:
        answer: |-
          \frac{e^{7x/2}}{7}+\frac{e^{-5x/2}}{5}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(x/2)*sinh(3*x)'
          ans: 'exp(7*x/2)/7 + exp(-5*x/2)/5'
          samples: [-1.0, 0.5, 1.5]
