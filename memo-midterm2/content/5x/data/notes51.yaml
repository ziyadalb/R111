patterns:
  - key: P1
    questions:
      - id: n51e1
        kind: example
        ref: 'مثال 1'
        page: 63
        prompt: 'Evaluate the integral.'
        q: '\int x\cos x\,dx'
        hint: |
          كثير حدود × $\cos x$: اشتق $x$ (مشتقته 1) وكامل $\cos x$.
        solution: |
          1. نشتق $x$ ونكامل $\cos x$:
             $$u=x,\qquad dv=\cos x\,dx,\qquad du=dx,\qquad v=\sin x$$
          2. نركّب القانون:
             $$\int x\cos x\,dx=x\sin x-\int\sin x\,dx$$
          3. تكامل $\sin x$ هو $-\cos x$، وسالب في سالب = موجب:
             $$-\int\sin x\,dx=-(-\cos x)=\cos x$$
        answer: |-
          x\sin x+\cos x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'x*cos(x)'
          ans: 'x*sin(x) + cos(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: n51e2
        kind: example
        ref: 'مثال 2'
        page: 63
        prompt: 'Evaluate the integral.'
        q: '\int x^2e^x\,dx'
        hint: |
          تجزئة مرتين، و$x^2$ هو $u$ في الأولى، و$x$ في الثانية.
        solution: |
          1. نشتق $x^2$ ونكامل $e^x$ (تكاملها نفسها):
             $$u=x^2,\qquad dv=e^x\,dx,\qquad du=2x\,dx,\qquad v=e^x$$
             $$\int x^2e^x\,dx=x^2e^x-2\int xe^x\,dx$$
          2. التكامل الجديد ضرب بعد، بس الدرجة نزلت. نجزّئ مرة ثانية:
             $$u=x,\qquad dv=e^x\,dx,\qquad du=dx,\qquad v=e^x$$
             $$\int xe^x\,dx=xe^x-\int e^x\,dx=xe^x-e^x$$
          3. نرجع للأول، و$-2$ تضرب في القوس كله:
             $$x^2e^x-2\big(xe^x-e^x\big)=x^2e^x-2xe^x+2e^x$$
          4. ناخذ $e^x$ عامل مشترك:
        answer: |-
          \big(x^2-2x+2\big)e^x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'x**2*exp(x)'
          ans: '(x**2-2*x+2)*exp(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: n51x1
        kind: exercise
        ref: 'تمرين 1'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int(2x+1)\cosh x\,dx'
        hint: |
          نفس M462-2-3: اشتق $2x+1$ وكامل $\cosh x$.
        solution: |
          1. نشتق كثير الحدود ونكامل $\cosh x$:
             $$u=2x+1,\qquad dv=\cosh x\,dx,\qquad du=2\,dx,\qquad v=\sinh x$$
          2. نركّب القانون:
             $$\int(2x+1)\cosh x\,dx=(2x+1)\sinh x-\int2\sinh x\,dx$$
          3. تكامل $\sinh$ هو $\cosh$ (بدون سالب):
             $$\int2\sinh x\,dx=2\cosh x$$
        answer: |-
          (2x+1)\sinh x-2\cosh x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: '(2*x+1)*cosh(x)'
          ans: '(2*x+1)*sinh(x) - 2*cosh(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: n51x2
        kind: exercise
        ref: 'تمرين 2'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int\big(x^2-1\big)\sin2x\,dx'
        hint: |
          تجزئة مرتين وكثير الحدود هو $u$. تكامل $\sin2x$ هو $-\frac12\cos2x$: فيه سالب وقسمة على 2.
        solution: |
          1. نشتق كثير الحدود ونكامل $\sin2x$ (نقسم على 2، وتكامل $\sin$ فيه سالب):
             $$u=x^2-1,\qquad dv=\sin2x\,dx,\qquad du=2x\,dx,\qquad v=-\tfrac12\cos2x$$
          2. نركّب القانون. السالب اللي قبل $\int v\,du$ في سالب $v$ يصير موجب:
             $$-\int v\,du=-\int\Big(-\tfrac12\cos2x\Big)(2x\,dx)=+\int x\cos2x\,dx$$
             $$\int\big(x^2-1\big)\sin2x\,dx=-\frac{x^2-1}{2}\cos2x+\int x\cos2x\,dx$$
          3. نجزّئ التكامل الجديد:
             $$u=x,\qquad dv=\cos2x\,dx,\qquad du=dx,\qquad v=\tfrac12\sin2x$$
             $$\int x\cos2x\,dx=\frac x2\sin2x-\frac12\int\sin2x\,dx=\frac x2\sin2x+\frac14\cos2x$$
          4. نجمع:
             $$-\frac{x^2-1}{2}\cos2x+\frac x2\sin2x+\frac14\cos2x$$
        answer: |-
          -\frac{x^2-1}{2}\cos2x+\frac x2\sin2x+\frac14\cos2x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: '(x**2-1)*sin(2*x)'
          ans: '-(x**2-1)/2*cos(2*x) + x/2*sin(2*x) + cos(2*x)/4'
          samples: [-2.0, 0.5, 3.0]

      - id: n51x3
        kind: exercise
        ref: 'تمرين 3'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int x^3e^x\,dx'
        hint: |
          الأس 3، فالتجزئة ثلاث مرات ($x^3$ ثم $x^2$ ثم $x$). أو استخدم الجدول.
        solution: |
          1. نشتق $x^3$ ونكامل $e^x$:
             $$u=x^3,\qquad dv=e^x\,dx,\qquad du=3x^2\,dx,\qquad v=e^x$$
             $$\int x^3e^x\,dx=x^3e^x-3\int x^2e^x\,dx$$
          2. $\int x^2e^x\,dx$ هو مثال 2 (تجزئة مرتين):
             $$\int x^2e^x\,dx=x^2e^x-2\int xe^x\,dx=x^2e^x-2\big(xe^x-e^x\big)=x^2e^x-2xe^x+2e^x$$
          3. نرجع للأول، و$-3$ تضرب في القوس كله:
             $$x^3e^x-3\big(x^2e^x-2xe^x+2e^x\big)=x^3e^x-3x^2e^x+6xe^x-6e^x$$
          4. ناخذ $e^x$ عامل مشترك:
        answer: |-
          \big(x^3-3x^2+6x-6\big)e^x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'x**3*exp(x)'
          ans: '(x**3-3*x**2+6*x-6)*exp(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: n51x4
        kind: exercise
        ref: 'تمرين 4'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int(x+1)\sec^2x\,dx'
        hint: |
          اشتق $x+1$ وكامل $\sec^2x$ (تكاملها $\tan x$). والتكامل الباقي $\int\tan x\,dx$.
        solution: |
          1. نشتق كثير الحدود ونكامل $\sec^2x$ (لأنها مشتقة $\tan x$):
             $$u=x+1,\qquad dv=\sec^2x\,dx,\qquad du=dx,\qquad v=\tan x$$
          2. نركّب القانون:
             $$\int(x+1)\sec^2x\,dx=(x+1)\tan x-\int\tan x\,dx$$
          3. نكتب $\tan x=\frac{\sin x}{\cos x}$. البسط هو سالب مشتقة المقام، فالتكامل $-\ln$ المقام:
             $$\int\tan x\,dx=\int\frac{\sin x}{\cos x}\,dx=-\ln|\cos x|$$
          4. نجمع، وسالب في سالب = موجب:
             $$(x+1)\tan x-\big(-\ln|\cos x|\big)$$
        answer: |-
          (x+1)\tan x+\ln|\cos x|+C
        domain: '\cos x\ne0'
        check:
          kind: indef
          f: '(x+1)*sec(x)**2'
          ans: '(x+1)*tan(x) + log(Abs(cos(x)))'
          samples: [-1.0, 0.3, 1.2, 2.5]

  - key: P2
    questions:
      - id: n51e3
        kind: example
        ref: 'مثال 3'
        page: 64
        prompt: 'Evaluate the integral.'
        q: '\int x^2\ln|x|\,dx'
        hint: |
          قوة × $\ln$: اشتق $\ln|x|$ وكامل $x^2$.
        solution: |
          1. نشتق اللوغاريتم (مشتقته تمسحه) ونكامل القوة:
             $$u=\ln|x|,\qquad dv=x^2\,dx,\qquad du=\frac{dx}{x},\qquad v=\frac{x^3}{3}$$
          2. نركّب القانون:
             $$\int x^2\ln|x|\,dx=\frac{x^3}{3}\ln|x|-\int\frac{x^3}{3}\cdot\frac1x\,dx$$
          3. نبسّط ($\frac{x^3}{x}=x^2$) ونكامل:
             $$\frac13\int x^2\,dx=\frac13\cdot\frac{x^3}{3}=\frac{x^3}{9}$$
        answer: |-
          \frac{x^3}{3}\ln|x|-\frac{x^3}{9}+C
        domain: 'x\ne0'
        fix: |
          حل المذكرة (ص64) كتب $v=x^2\,dx$، والصحيح $dv=x^2\,dx$. الجواب النهائي صحيح.
        check:
          kind: indef
          f: 'x**2*log(Abs(x))'
          ans: 'x**3/3*log(Abs(x)) - x**3/9'
          samples: [-2.0, -0.3, 0.4, 2.5]

      - id: n51x6
        kind: exercise
        ref: 'تمرين 6'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int x^5\ln|x|\,dx'
        hint: |
          نفس مثال 3: اشتق $\ln|x|$ وكامل $x^5$.
        solution: |
          1. نشتق اللوغاريتم ونكامل القوة:
             $$u=\ln|x|,\qquad dv=x^5\,dx,\qquad du=\frac{dx}{x},\qquad v=\frac{x^6}{6}$$
          2. نركّب القانون، ونبسّط ($\frac{x^6}{x}=x^5$):
             $$\int x^5\ln|x|\,dx=\frac{x^6}{6}\ln|x|-\frac16\int x^5\,dx$$
          3. نكامل:
             $$\frac16\cdot\frac{x^6}{6}=\frac{x^6}{36}$$
        answer: |-
          \frac{x^6}{6}\ln|x|-\frac{x^6}{36}+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: 'x**5*log(Abs(x))'
          ans: 'x**6/6*log(Abs(x)) - x**6/36'
          samples: [-2.0, -0.3, 0.4, 2.5]

      - id: n51x7
        kind: exercise
        ref: 'تمرين 7'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int x^{-4}\ln|x|\,dx'
        hint: |
          نفس F461-2-2 والأس $-4$: اشتق $\ln|x|$ وكامل $x^{-4}$، وانتبه للإشارات.
        solution: |
          1. نشتق اللوغاريتم ونكامل القوة. الأس $-4$ يصير $-3$ ونقسم عليه:
             $$u=\ln|x|,\qquad dv=x^{-4}dx,\qquad du=\frac{dx}{x},\qquad v=\frac{x^{-3}}{-3}=-\frac{1}{3x^3}$$
          2. نركّب القانون. سالب في سالب = موجب، و$\frac{1}{x^3}\cdot\frac1x=x^{-4}$:
             $$\int x^{-4}\ln|x|\,dx=-\frac{\ln|x|}{3x^3}+\frac13\int x^{-4}\,dx$$
          3. نكامل:
             $$\frac13\cdot\frac{x^{-3}}{-3}=-\frac{1}{9x^3}$$
        answer: |-
          -\frac{\ln|x|}{3x^3}-\frac{1}{9x^3}+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: 'log(Abs(x))/x**4'
          ans: '-log(Abs(x))/(3*x**3) - 1/(9*x**3)'
          samples: [-2.0, -0.5, 0.5, 2.0]

      - id: n51x5
        kind: exercise
        ref: 'تمرين 5'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int\ln|x|\,dx'
        hint: |
          $\ln$ لحاله: اعتبره مضروب في 1. اشتقه، وكامل $dx$.
        solution: |
          1. $\ln$ لحاله: نعتبره مضروب في 1. نشتق $\ln|x|$ ونكامل الواحد، ونوقف في الصف الثاني:
             @di \ln|x| & 1 ;; !\frac1x & x
          2. القطر، ناقص تكامل ضرب الصف الأخير ($\frac1x\cdot x=1$):
             $$x\ln|x|-\int1\,dx=x\ln|x|-x$$
        answer: |-
          x\ln|x|-x+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: 'log(Abs(x))'
          ans: 'x*log(Abs(x)) - x'
          samples: [-2.0, -0.3, 0.4, 2.5]

      - id: n51e4
        kind: example
        ref: 'مثال 4'
        page: 64
        prompt: 'Evaluate the integral.'
        q: '\int\ln\big(1+x^2\big)\,dx'
        hint: |
          $\ln$ لحاله: $dv=dx$. والكسر اللي يطلع بعدها: اكتب البسط بدلالة المقام.
        solution: |
          1. اللوغاريتم لحاله، نعتبره مضروب في 1. مشتقة $\ln(1+x^2)$ = مشتقة الداخل على الداخل:
             $$u=\ln\big(1+x^2\big),\qquad dv=dx,\qquad du=\frac{2x}{1+x^2}\,dx,\qquad v=x$$
          2. نركّب القانون:
             $$\int\ln\big(1+x^2\big)dx=x\ln\big(1+x^2\big)-\int\frac{2x^2}{1+x^2}\,dx$$
          3. البسط درجته نفس المقام، فنكتبه بدلالة المقام (نضيف 2 ونطرحه):
             $$\frac{2x^2}{1+x^2}=\frac{2\big(1+x^2\big)-2}{1+x^2}=2-\frac{2}{1+x^2}$$
          4. نكامل. الحد الثاني قانون $\tan^{-1}$:
             $$\int\Big(2-\frac{2}{1+x^2}\Big)dx=2x-2\tan^{-1}x$$
          5. نرجع للقانون، والسالب يتوزع على القوس:
             $$x\ln\big(1+x^2\big)-\big(2x-2\tan^{-1}x\big)$$
        answer: |-
          x\ln\big(1+x^2\big)-2x+2\tan^{-1}x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'log(1+x**2)'
          ans: 'x*log(1+x**2) - 2*x + 2*atan(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: n51x16
        kind: exercise
        ref: 'تمرين 16'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int\big(\ln|x|\big)^2\,dx'
        hint: |
          نفس تمرين 5: $dv=dx$. ومشتقة $(\ln|x|)^2$ بقاعدة السلسلة. بعدها يطلع لك $\int\ln|x|\,dx$.
        solution: |
          1. اللوغاريتم المربع لحاله: نشتقه (القوة تنزل، والداخل $\ln|x|$ مشتقته $\frac1x$) ونكامل الواحد:
             $$u=\big(\ln|x|\big)^2,\qquad dv=dx,\qquad du=2\ln|x|\cdot\frac{dx}{x},\qquad v=x$$
          2. نركّب القانون. $x\cdot\frac1x=1$:
             $$\int\big(\ln|x|\big)^2dx=x\big(\ln|x|\big)^2-2\int\ln|x|\,dx$$
          3. $\int\ln|x|\,dx$ هو تمرين 5:
             $$\int\ln|x|\,dx=x\ln|x|-x$$
          4. نرجع، و$-2$ تضرب في القوس كله:
             $$x\big(\ln|x|\big)^2-2\big(x\ln|x|-x\big)$$
        answer: |-
          x\big(\ln|x|\big)^2-2x\ln|x|+2x+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: 'log(Abs(x))**2'
          ans: 'x*log(Abs(x))**2 - 2*x*log(Abs(x)) + 2*x'
          samples: [-2.0, -0.3, 0.4, 2.5]

  - key: P3
    questions:
      - id: n51x9
        kind: exercise
        ref: 'تمرين 9'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int\sec^{-1}x\,dx'
        hint: |
          نفس M462-2-8: $u=\sec^{-1}x$ و$dv=dx$. التكامل الباقي قانون من 4.2.
        solution: |
          1. العكسية لحالها، نعتبرها مضروبة في 1. نشتقها (قانون المذكرة) ونكامل الواحد:
             $$u=\sec^{-1}x,\qquad dv=dx,\qquad du=\frac{dx}{x\sqrt{x^2-1}},\qquad v=x$$
          2. نركّب القانون. الـ $x$ تنشطب:
             $$\int\sec^{-1}x\,dx=x\sec^{-1}x-\int\frac{x\,dx}{x\sqrt{x^2-1}}=x\sec^{-1}x-\int\frac{dx}{\sqrt{x^2-1}}$$
          3. التكامل الباقي قانون من 4.2 ($u^2-a^2$ بدون شي برّا الجذر، و$a=1$):
             $$\int\frac{dx}{\sqrt{x^2-1}}=\ln\big|x+\sqrt{x^2-1}\big|$$
        answer: |-
          x\sec^{-1}x-\ln\big|x+\sqrt{x^2-1}\big|+C
        domain: '|x|>1'
        domain_why: 'على تعريف المذكرة لـ $\sec^{-1}$ (مشتقته $\frac{1}{x\sqrt{x^2-1}}$).'
        check:
          kind: indef
          f: 'Piecewise((asec(x), x > 0), (2*pi - asec(x), True))'
          ans: 'x*Piecewise((asec(x), x > 0), (2*pi - asec(x), True)) - log(Abs(x + sqrt(x**2-1)))'
          samples: [-3.0, -1.5, 1.5, 3.0]

      - id: n51e6
        kind: example
        ref: 'مثال 6'
        page: 65
        prompt: 'Evaluate the integral.'
        q: '\int x\sec^{-1}x\,dx'
        hint: |
          نفس M472-3-1: اشتق $\sec^{-1}x$ وكامل $x\,dx$. التكامل الباقي بتعويض: الداخل $x^2-1$.
        solution: |
          1. نشتق العكسية (قانون المذكرة) ونكامل $x$:
             $$u=\sec^{-1}x,\qquad dv=x\,dx,\qquad du=\frac{dx}{x\sqrt{x^2-1}},\qquad v=\frac{x^2}{2}$$
          2. نركّب القانون، ونبسّط ($\frac{x^2}{x}=x$):
             $$\int x\sec^{-1}x\,dx=\frac{x^2}{2}\sec^{-1}x-\frac12\int\frac{x}{\sqrt{x^2-1}}\,dx$$
          3. التكامل الباقي بتعويض (نفس اللي في $\int\cosh^{-1}x\,dx$):
             $$w=x^2-1,\qquad dw=2x\,dx\quad\Rightarrow\quad x\,dx=\frac{dw}{2}$$
             $$\int\frac{x\,dx}{\sqrt{x^2-1}}=\frac12\int w^{-1/2}dw=\frac12\cdot\frac{w^{1/2}}{1/2}=\sqrt{x^2-1}$$
        answer: |-
          \frac{x^2}{2}\sec^{-1}x-\frac12\sqrt{x^2-1}+C
        domain: '|x|>1'
        domain_why: 'على تعريف المذكرة لـ $\sec^{-1}$ (مشتقته $\frac{1}{x\sqrt{x^2-1}}$).'
        fix: |
          حل المذكرة (ص65) كتب $dv=dx$، والصحيح $dv=x\,dx$ (لأن $v=\frac{x^2}{2}$). وكتب تحت الجذر $1-x^2$، والصحيح $x^2-1$. الجواب النهائي صحيح.
        check:
          kind: indef
          f: 'x*Piecewise((asec(x), x > 0), (2*pi - asec(x), True))'
          ans: 'x**2/2*Piecewise((asec(x), x > 0), (2*pi - asec(x), True)) - sqrt(x**2-1)/2'
          samples: [-3.0, -1.5, 1.5, 3.0]

      - id: n51x10
        kind: exercise
        ref: 'تمرين 10'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int x\,\csch^{-1}x\,dx'
        hint: |
          نفس M472-3-1 مع $\csch^{-1}x$. مشتقتها فيها $|x|$: خذ $x>0$ أول. التكامل الباقي بتعويض: الداخل $1+x^2$.
        solution: |
          1. نشتق العكسية ونكامل $x$. مشتقة $\csch^{-1}x$ فيها $|x|$، فناخذ $x>0$ (يعني $|x|=x$):
             $$u=\csch^{-1}x,\qquad dv=x\,dx,\qquad du=\frac{-dx}{x\sqrt{1+x^2}},\qquad v=\frac{x^2}{2}$$
          2. نركّب القانون. سالب في سالب = موجب، و$\frac{x^2}{x}=x$:
             $$\int x\csch^{-1}x\,dx=\frac{x^2}{2}\csch^{-1}x+\frac12\int\frac{x}{\sqrt{1+x^2}}\,dx$$
          3. التكامل الباقي بتعويض:
             $$w=1+x^2,\qquad dw=2x\,dx\quad\Rightarrow\quad x\,dx=\frac{dw}{2}$$
             $$\int\frac{x\,dx}{\sqrt{1+x^2}}=\frac12\int w^{-1/2}dw=\sqrt{1+x^2}$$
        answer: |-
          \frac{x^2}{2}\csch^{-1}x+\frac12\sqrt{1+x^2}+C
        domain: 'x>0'
        note: |
          لو $x<0$: $|x|=-x$، فمشتقة $\csch^{-1}x$ تطلع بدون السالب، وتنقلب إشارة الجذر:
          $$\frac{x^2}{2}\csch^{-1}x-\frac12\sqrt{1+x^2}+C$$
        check:
          kind: indef
          f: 'x*acsch(x)'
          ans: 'x**2/2*acsch(x) + sqrt(1+x**2)/2'
          samples: [0.3, 1.0, 3.0]
          extra:
            - ans: 'x**2/2*acsch(x) - sqrt(1+x**2)/2'
              samples: [-3.0, -0.4]

  - key: P4
    questions:
      - id: n51e7
        kind: example
