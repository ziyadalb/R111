        page: 65
        prompt: 'Evaluate the integral.'
        q: '\int e^x\cos x\,dx'
        hint: |
          الدوّارة: جزّئ مرتين والأسّية $dv$ في المرتين. بيرجع لك نفس التكامل، سمّه $I$ وحلّه كمعادلة.
        solution: |
          1. أسّية × $\cos$ (دوّارة): نشتق $\cos x$ ونكامل $e^x$ (تكاملها نفسها)، ونوقف في الصف الثالث لما يرجع السؤال:
             @di \cos x & e^x ;; -\sin x & e^x ;; !-\cos x & e^x
          2. نسمّي السؤال $I$. القطرين بإشاراتهم، وبعدهم تكامل ضرب الصف الأخير ($-e^x\cos x$) بإشارته $+$، وهو $-I$:
             $$I=e^x\cos x+e^x\sin x-I$$
          3. ننقل $I$ لليسار: $2I=e^x\cos x+e^x\sin x$. ونقسم على 2:
        answer: |-
          \frac{e^x}{2}\big(\cos x+\sin x\big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(x)*cos(x)'
          ans: 'exp(x)/2*(cos(x) + sin(x))'
          samples: [-1.0, 0.5, 2.0]

      - id: n51x11
        kind: exercise
        ref: 'تمرين 11'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int e^{2x}\sin3x\,dx'
        hint: |
          نفس F472-2-3: الأسّية $dv$ في المرتين. انتبه للـ 3 في مشتقة $\sin3x$ و$\cos3x$.
        solution: |
          1. دوّارة: نشتق $\sin3x$ (كل مشتقة تضرب في 3)، ونكامل $e^{2x}$ (كل تكامل يقسم على 2)، ونوقف في الصف الثالث:
             @di \sin3x & e^{2x} ;; 3\cos3x & \frac12e^{2x} ;; !-9\sin3x & \frac14e^{2x}
          2. القطرين بإشاراتهم، وبعدهم تكامل ضرب الصف الأخير. ضربه $-\frac94e^{2x}\sin3x$، يعني تكامله $-\frac94I$:
             $$I=\frac12e^{2x}\sin3x-\frac34e^{2x}\cos3x-\frac94I$$
          3. ننقل: $I+\frac94I=\frac{13}{4}I$، ونضرب في $\frac4{13}$:
             $$I=\frac{2}{13}e^{2x}\sin3x-\frac{3}{13}e^{2x}\cos3x$$
        answer: |-
          \frac{e^{2x}}{13}\big(2\sin3x-3\cos3x\big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(2*x)*sin(3*x)'
          ans: 'exp(2*x)/13*(2*sin(3*x) - 3*cos(3*x))'
          samples: [-1.0, 0.5, 2.0]

      - id: n51x12
        kind: exercise
        ref: 'تمرين 12'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int e^{5x}\cos2x\,dx'
        hint: |
          نفس مثال 7: الأسّية $dv$ في المرتين. تكامل $e^{5x}$ هو $\frac15e^{5x}$.
        solution: |
          1. نسمّي التكامل $I$. الأسّية $dv$:
             $$u=\cos2x,\qquad dv=e^{5x}dx,\qquad du=-2\sin2x\,dx,\qquad v=\tfrac15e^{5x}$$
             $$I=\tfrac15e^{5x}\cos2x+\tfrac25\int e^{5x}\sin2x\,dx$$
          2. نفس الاختيار مرة ثانية:
             $$u=\sin2x,\qquad dv=e^{5x}dx,\qquad du=2\cos2x\,dx,\qquad v=\tfrac15e^{5x}$$
             $$\int e^{5x}\sin2x\,dx=\tfrac15e^{5x}\sin2x-\tfrac25I$$
          3. نعوّض، و$\frac25$ تضرب في القوس كله:
             $$I=\tfrac15e^{5x}\cos2x+\tfrac{2}{25}e^{5x}\sin2x-\tfrac{4}{25}I$$
          4. ننقل $I$ لليسار: $I+\frac{4}{25}I=\frac{29}{25}I$:
             $$\tfrac{29}{25}I=\tfrac15e^{5x}\cos2x+\tfrac{2}{25}e^{5x}\sin2x$$
          5. نضرب الطرفين في $\frac{25}{29}$:
             $$I=\tfrac{5}{29}e^{5x}\cos2x+\tfrac{2}{29}e^{5x}\sin2x$$
        answer: |-
          \frac{e^{5x}}{29}\big(5\cos2x+2\sin2x\big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(5*x)*cos(2*x)'
          ans: 'exp(5*x)/29*(5*cos(2*x) + 2*sin(2*x))'
          samples: [-1.0, 0.3, 1.0]

      - id: n51x13
        kind: exercise
        ref: 'تمرين 13'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int e^{3x}\sinh x\,dx'
        hint: |
          نفس M462-2-5: اكتب $\sinh x$ بالتعريف، واضرب في $e^{3x}$.
        solution: |
          1. نكتب $\sinh x$ بالتعريف (فيه طرح):
             $$\sinh x=\frac{e^x-e^{-x}}{2}$$
          2. نضرب في $e^{3x}$ ونجمع الأسس:
             $$e^{3x}\sinh x=\frac{e^{4x}-e^{2x}}{2}$$
          3. نكامل كل حد ($\int e^{kx}dx=\frac{e^{kx}}{k}$):
             $$\frac12\cdot\frac{e^{4x}}{4}-\frac12\cdot\frac{e^{2x}}{2}$$
        answer: |-
          \frac{e^{4x}}{8}-\frac{e^{2x}}{4}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(3*x)*sinh(x)'
          ans: 'exp(4*x)/8 - exp(2*x)/4'
          samples: [-1.0, 0.5, 1.5]

      - id: n51x14
        kind: exercise
        ref: 'تمرين 14'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int e^{x}\cosh5x\,dx'
        hint: |
          نفس M461-2-3: اكتب $\cosh5x$ بالتعريف، واضرب في $e^x$.
        solution: |
          1. نكتب $\cosh5x$ بالتعريف:
             $$\cosh5x=\frac{e^{5x}+e^{-5x}}{2}$$
          2. نضرب في $e^x$ ونجمع الأسس:
             $$e^x\cosh5x=\frac{e^{6x}+e^{-4x}}{2}$$
          3. نكامل كل حد:
             $$\frac12\cdot\frac{e^{6x}}{6}+\frac12\cdot\frac{e^{-4x}}{-4}$$
        answer: |-
          \frac{e^{6x}}{12}-\frac{e^{-4x}}{8}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'exp(x)*cosh(5*x)'
          ans: 'exp(6*x)/12 - exp(-4*x)/8'
          samples: [-1.0, 0.3, 1.0]

  - key: P5
    questions:
      - id: n51x15
        kind: exercise
        ref: 'تمرين 15'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int e^{\sqrt x}\,dx'
        hint: |
          عوّض أول: $w=\sqrt x$ يعني $x=w^2$ و$dx=2w\,dw$. بعدها يصير كثير حدود × أسّية.
        solution: |
          1. الجذر داخل الأسّية ما ينفع معه تجزئة مباشرة. نعوّض أول، ونكتب $dx$ كامل:
             $$w=\sqrt x,\qquad x=w^2,\qquad dx=2w\,dw$$
             $$\int e^{\sqrt x}\,dx=\int e^{w}\cdot2w\,dw=2\int we^w\,dw$$
          2. صار كثير حدود × أسّية. نجزّئ:
             $$u=w,\qquad dv=e^w\,dw,\qquad du=dw,\qquad v=e^w$$
             $$\int we^w\,dw=we^w-\int e^w\,dw=we^w-e^w$$
          3. نرجع لـ $x$ ($w=\sqrt x$):
             $$2\big(we^w-e^w\big)=2\sqrt x\,e^{\sqrt x}-2e^{\sqrt x}$$
        answer: |-
          2\big(\sqrt x-1\big)e^{\sqrt x}+C
        domain: 'x>0'
        check:
          kind: indef
          f: 'exp(sqrt(x))'
          ans: '2*(sqrt(x)-1)*exp(sqrt(x))'
          samples: [0.3, 1.5, 4.0]

      - id: n51x17
        kind: exercise
        ref: 'تمرين 17'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int x^3\sqrt{x^2-1}\,dx'
        hint: |
          قسّم $x^3=x^2\cdot x$: خل $x\sqrt{x^2-1}\,dx$ هو $dv$ (تكامله بتعويض)، و$u=x^2$.
        solution: |
          1. $\sqrt{x^2-1}$ لحاله ما نعرف نكامله، بس $x\sqrt{x^2-1}$ نعرف (فيه مشتقة الداخل). فنقسم القوة:
             $$x^3\sqrt{x^2-1}=x^2\cdot x\sqrt{x^2-1}$$
             $$u=x^2,\qquad dv=x\sqrt{x^2-1}\,dx,\qquad du=2x\,dx$$
          2. نطلع $v$ بتعويض:
             $$w=x^2-1,\qquad x\,dx=\frac{dw}{2}$$
             $$v=\frac12\int w^{1/2}dw=\frac12\cdot\frac{w^{3/2}}{3/2}=\frac13\big(x^2-1\big)^{3/2}$$
          3. نركّب القانون:
             $$\int x^3\sqrt{x^2-1}\,dx=\frac{x^2}{3}\big(x^2-1\big)^{3/2}-\frac23\int x\big(x^2-1\big)^{3/2}dx$$
          4. التكامل الباقي بنفس التعويض:
             $$\int x\big(x^2-1\big)^{3/2}dx=\frac12\int w^{3/2}dw=\frac12\cdot\frac{w^{5/2}}{5/2}=\frac15\big(x^2-1\big)^{5/2}$$
          5. نجمع: $\frac23\cdot\frac15=\frac{2}{15}$:
        answer: |-
          \frac{x^2}{3}\big(x^2-1\big)^{3/2}-\frac{2}{15}\big(x^2-1\big)^{5/2}+C
        domain: '|x|>1'
        more: |
          بتعويض $w=x^2-1$ بس (بدون تجزئة، و$x^2=w+1$) يطلع نفس الجواب بشكل ثاني:
          $$\frac15\big(x^2-1\big)^{5/2}+\frac13\big(x^2-1\big)^{3/2}+C$$
        check:
          kind: indef
          f: 'x**3*sqrt(x**2-1)'
          ans: 'x**2/3*(x**2-1)**Rational(3,2) - Rational(2,15)*(x**2-1)**Rational(5,2)'
          samples: [-3.0, -1.5, 1.5, 3.0]
          alt:
            - '(x**2-1)**Rational(5,2)/5 + (x**2-1)**Rational(3,2)/3'

      - id: n51x18
        kind: exercise
        ref: 'تمرين 18'
        page: 66
        prompt: 'Evaluate the integral.'
        q: '\int x^7\sqrt{x^4+2}\,dx'
        hint: |
          نفس تمرين 17: $x^7=x^4\cdot x^3$. خل $x^3\sqrt{x^4+2}\,dx$ هو $dv$، و$u=x^4$.
        solution: |
          1. نقسم القوة: نخلي مع الجذر $x^3$ لأنها (ناقصها 4) مشتقة $x^4+2$:
             $$x^7\sqrt{x^4+2}=x^4\cdot x^3\sqrt{x^4+2}$$
             $$u=x^4,\qquad dv=x^3\sqrt{x^4+2}\,dx,\qquad du=4x^3\,dx$$
          2. نطلع $v$ بتعويض:
             $$w=x^4+2,\qquad x^3\,dx=\frac{dw}{4}$$
             $$v=\frac14\int w^{1/2}dw=\frac14\cdot\frac{w^{3/2}}{3/2}=\frac16\big(x^4+2\big)^{3/2}$$
          3. نركّب القانون. $\frac16\cdot4=\frac23$:
             $$\int x^7\sqrt{x^4+2}\,dx=\frac{x^4}{6}\big(x^4+2\big)^{3/2}-\frac23\int x^3\big(x^4+2\big)^{3/2}dx$$
          4. التكامل الباقي بنفس التعويض:
             $$\int x^3\big(x^4+2\big)^{3/2}dx=\frac14\int w^{3/2}dw=\frac14\cdot\frac{w^{5/2}}{5/2}=\frac{1}{10}\big(x^4+2\big)^{5/2}$$
          5. نجمع: $\frac23\cdot\frac{1}{10}=\frac{1}{15}$:
        answer: |-
          \frac{x^4}{6}\big(x^4+2\big)^{3/2}-\frac{1}{15}\big(x^4+2\big)^{5/2}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'x**7*sqrt(x**4+2)'
          ans: 'x**4/6*(x**4+2)**Rational(3,2) - (x**4+2)**Rational(5,2)/15'
          samples: [-1.5, 0.5, 1.2]
          alt:
            - '(x**4+2)**Rational(5,2)/10 - (x**4+2)**Rational(3,2)/3'
