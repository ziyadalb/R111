        solution: |
          1. قوة زوجية وما فيه شي نحجزه، فنخفّض القوة (الزاوية تتضاعف):
             $$\sin^2x=\frac{1-\cos2x}{2}=\frac12-\frac12\cos2x$$
          2. نكامل كل حد. تكامل $\cos2x$ هو $\frac{\sin2x}{2}$:
             $$\int\Big(\frac12-\frac12\cos2x\Big)dx=\frac x2-\frac12\cdot\frac{\sin2x}{2}$$
        answer: |-
          \frac x2-\frac{\sin2x}{4}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)**2'
          ans: 'x/2 - sin(2*x)/4'
