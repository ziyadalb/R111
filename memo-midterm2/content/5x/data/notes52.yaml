          3. نكامل:
             $$=\frac{u^3}{3}+\frac{2u^5}{5}+\frac{u^7}{7}+C$$
        answer: |-
          \frac{\tan^3x}{3}+\frac{2\tan^5x}{5}+\frac{\tan^7x}{7}+C
        domain: '\cos x\ne0'
        check:
