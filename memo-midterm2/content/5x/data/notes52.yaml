      - id: n52e2-2
        kind: example
        ref: 'مثال (2) فقرة 2'
        page: 69
        prompt: 'Evaluate the integral.'
        q: '\int\sqrt{\sin x}\,\cos^3x\,dx'
        hint: |
          قوة $\sin$ كسرية، بس قوة $\cos$ فردية: احجز $\cos x$، و$u=\sin x$.
        solution: |
          1. قوة $\sin$ هنا $\frac12$: كسرية، ما نقول عنها زوجية أو فردية. بس قوة $\cos$ فردية، فنحجز $\cos x$:
             $$\cos^3x=\big(1-\sin^2x\big)\cos x$$
          2. نعوّض:
             $$u=\sin x,\qquad du=\cos x\,dx$$
             $$\int\sqrt{\sin x}\cos^3x\,dx=\int u^{1/2}\big(1-u^2\big)du=\int\big(u^{1/2}-u^{5/2}\big)du$$
          3. نكامل (نزيد الأس واحد ونقسم على الجديد): $\frac12+1=\frac32$ و$\frac52+1=\frac72$:
             $$=\frac{u^{3/2}}{3/2}-\frac{u^{7/2}}{7/2}+C=\frac23u^{3/2}-\frac27u^{7/2}+C$$
        answer: |-
          \frac23\big(\sin x\big)^{3/2}-\frac27\big(\sin x\big)^{7/2}+C
        domain: '\sin x>0'
        check:
          kind: indef
          f: 'sqrt(sin(x))*cos(x)**3'
          ans: '2*sin(x)**Rational(3,2)/3 - 2*sin(x)**Rational(7,2)/7'
          samples: [0.3, 1.2, 2.5]

