      - id: n52e1-1
        kind: example
        ref: 'مثال (1) فقرة 1'
        page: 67
        prompt: 'Evaluate the integral.'
        q: '\int\cos^3x\,dx'
        hint: |
          قوة $\cos$ فردية: احجز $\cos x$ واحد، وحوّل الباقي لـ $\sin$.
          $$u=\sin x$$
        solution: |
          1. قوة $\cos$ فردية، نحجز $\cos x$ واحد (مشتقة $\sin x$)، ونحوّل الباقي بالهوية:
             $$\cos^3x=\cos^2x\cdot\cos x=\big(1-\sin^2x\big)\cos x$$
          2. نعوّض:
             $$u=\sin x,\qquad du=\cos x\,dx$$
             $$\int\cos^3x\,dx=\int\big(1-u^2\big)du=u-\frac{u^3}{3}+C$$
        answer: |-
          \sin x-\frac{\sin^3x}{3}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'cos(x)**3'
          ans: 'sin(x) - sin(x)**3/3'
          samples: [-1.0, 0.4, 2.0, 4.5]

      - id: n52e1-2
        kind: example
        ref: 'مثال (1) فقرة 2'
        page: 67
        prompt: 'Evaluate the integral.'
        q: '\int\sin^5x\,dx'
        hint: |
          قوة $\sin$ فردية: احجز $\sin x$ واحد، وحوّل الباقي لـ $\cos$. وانتبه: $du=-\sin x\,dx$.
        solution: |
          1. قوة $\sin$ فردية، نحجز $\sin x$ واحد، والباقي قوته زوجية نحوّله:
             $$\sin^5x=\big(\sin^2x\big)^2\sin x=\big(1-\cos^2x\big)^2\sin x$$
          2. نعوّض، وننتبه للسالب:
             $$u=\cos x,\qquad du=-\sin x\,dx\quad\Rightarrow\quad\sin x\,dx=-du$$
             $$\int\sin^5x\,dx=-\int\big(1-u^2\big)^2du=-\int\big(1-2u^2+u^4\big)du$$
          3. نكامل، والسالب يتوزع على كل الحدود:
             $$=-\Big(u-\frac{2u^3}{3}+\frac{u^5}{5}\Big)+C$$
        answer: |-
          -\cos x+\frac{2\cos^3x}{3}-\frac{\cos^5x}{5}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)**5'
          ans: '-cos(x) + 2*cos(x)**3/3 - cos(x)**5/5'
          samples: [-1.0, 0.4, 2.0, 4.5]

      - id: n52e2-1
        kind: example
        ref: 'مثال (2) فقرة 1'
        page: 69
        prompt: 'Evaluate the integral.'
        q: '\int\sin^5x\,\cos^2x\,dx'
        hint: |
          قوة $\sin$ فردية (وقوة $\cos$ زوجية): احجز $\sin x$، و$u=\cos x$ مع السالب.
        solution: |
          1. قوة $\sin$ فردية، نحجز $\sin x$ ونحوّل الباقي:
             $$\sin^5x=\big(1-\cos^2x\big)^2\sin x$$
          2. نعوّض، وننتبه للسالب:
             $$u=\cos x,\qquad\sin x\,dx=-du$$
             $$\int\sin^5x\cos^2x\,dx=-\int\big(1-u^2\big)^2u^2\,du$$
          3. نفك المربع ونضرب في $u^2$:
             $$-\int\big(1-2u^2+u^4\big)u^2\,du=-\int\big(u^2-2u^4+u^6\big)du$$
          4. نكامل، والسالب يتوزع:
             $$=-\Big(\frac{u^3}{3}-\frac{2u^5}{5}+\frac{u^7}{7}\Big)+C$$
        answer: |-
          -\frac{\cos^3x}{3}+\frac{2\cos^5x}{5}-\frac{\cos^7x}{7}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)**5*cos(x)**2'
          ans: '-cos(x)**3/3 + 2*cos(x)**5/5 - cos(x)**7/7'
          samples: [-1.0, 0.4, 2.0, 4.5]

