      - id: n52e1-3
        kind: example
        ref: 'مثال (1) فقرة 3'
        page: 68
        prompt: 'Evaluate the integral.'
        q: '\int\cos^4 2x\,dx'
        hint: |
          قوة زوجية: اكتبها $\big(\cos^22x\big)^2$ وخفّض. بيطلع لك $\cos^24x$: خفّضها مرة ثانية.
        solution: |
          1. القوة زوجية (4)، نكتبها مربع ونخفّض. الزاوية تتضاعف ($2x$ تصير $4x$):
             $$\cos^42x=\big(\cos^22x\big)^2,\qquad\cos^22x=\frac{1+\cos4x}{2}$$
          2. نربّع (مربع مجموع، مو كل حد لحاله):
             $$\Big(\frac{1+\cos4x}{2}\Big)^2=\frac14\big(1+2\cos4x+\cos^24x\big)$$
          3. $\cos^24x$ قوة زوجية بعد، نخفّضها ($4x$ تصير $8x$):
             $$\cos^24x=\frac{1+\cos8x}{2}$$
             $$\frac14\Big(1+2\cos4x+\frac12+\frac12\cos8x\Big)=\frac38+\frac12\cos4x+\frac18\cos8x$$
          4. نكامل كل حد ($\int\cos kx\,dx=\frac{\sin kx}{k}$):
             $$\frac38x+\frac12\cdot\frac{\sin4x}{4}+\frac18\cdot\frac{\sin8x}{8}$$
        answer: |-
          \frac38x+\frac18\sin4x+\frac{1}{64}\sin8x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'cos(2*x)**4'
          ans: '3*x/8 + sin(4*x)/8 + sin(8*x)/64'
          samples: [-1.0, 0.4, 2.0]

      - id: n52e2-4
        kind: example
        ref: 'مثال (2) فقرة 4'
        page: 70
        prompt: 'Evaluate the integral.'
        q: '\int\sin^2x\,\cos^4x\,dx'
        hint: |
          القوتين زوجيات: خفّض الاثنين. بعدها $(1-\cos2x)(1+\cos2x)=\sin^22x$.
        solution: |
          1. القوتين زوجيات، فنخفّض. نكتب $\cos^4x=\big(\cos^2x\big)^2$:
             $$\sin^2x=\frac{1-\cos2x}{2},\qquad\cos^2x=\frac{1+\cos2x}{2}$$
             $$\sin^2x\cos^4x=\frac{1-\cos2x}{2}\cdot\frac{(1+\cos2x)^2}{4}=\frac18(1-\cos2x)(1+\cos2x)(1+\cos2x)$$
          2. أول قوسين فرق مربعين:
             $$(1-\cos2x)(1+\cos2x)=1-\cos^22x=\sin^22x$$
             $$\sin^2x\cos^4x=\frac18\sin^22x\,(1+\cos2x)=\frac18\sin^22x+\frac18\sin^22x\cos2x$$
          3. الحد الأول قوة زوجية، نخفّضه مرة ثانية:
             $$\frac18\int\sin^22x\,dx=\frac18\int\frac{1-\cos4x}{2}\,dx=\frac{x}{16}-\frac{\sin4x}{64}$$
          4. الحد الثاني فيه $\cos2x$، وهي مشتقة $\sin2x$ ناقصها 2:
             $$w=\sin2x,\qquad dw=2\cos2x\,dx\quad\Rightarrow\quad\cos2x\,dx=\frac{dw}{2}$$
             $$\frac18\int\sin^22x\cos2x\,dx=\frac{1}{16}\int w^2\,dw=\frac{w^3}{48}=\frac{\sin^32x}{48}$$
        answer: |-
          \frac{x}{16}-\frac{\sin4x}{64}+\frac{\sin^32x}{48}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)**2*cos(x)**4'
          ans: 'x/16 - sin(4*x)/64 + sin(2*x)**3/48'
          samples: [-1.0, 0.4, 2.0]

