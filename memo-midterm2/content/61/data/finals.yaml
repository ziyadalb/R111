# أسئلة 6.1 اللي جات في الاختبارات النهائية (1445 إلى 1447)
# المعرف: F + السنة والفصل + السؤال + الفقرة. نهائي 1445 الفصل الثاني ما فيه سؤال نهايات.
section: '6.1'
