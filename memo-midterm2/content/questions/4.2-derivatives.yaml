# القسم 4.2: المشتقات (السؤال الأول في كل فصلي ثاني)
# الحلول بدون حروف للداخل: «الداخل كذا ومشتقته كذا»، والقانون يتطبق على الشي نفسه.
# الحقول: id (النموذج-السؤال-الفقرة)، marks، page (صفحة PDF في ملف النماذج)، prompt، q، solution، answer،
# domain، domain_why، fix (تصحيح للمفتاح)، note، trick (حيلة أسرع)، more، check (للتحقق في verify/verify.py).
section: '4.2'
slug: d42
title: 'الدوال الزائدية العكسية: المشتقات'
patterns:
  - key: D1
    title: 'دالة داخلها دالة'
    questions:
      - id: M471-1-2
        marks: 2
        page: 5
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\sech\big(5x^2\big)+\tanh^{-1}(\sin x)'
        solution: |
          1. **نقسم على الجمع:** كل حد نشتقه لحاله، لأن مشتقة المجموع = مجموع المشتقات.
          2. **الحد الأول:** الخارج $\sech$، والداخل $5x^2$ ومشتقته $10x$. مشتقة $\sech$ فيها سالب (بعكس $\sec$):
             $$\frac{d}{dx}\sech\big(5x^2\big)=-\sech\big(5x^2\big)\tanh\big(5x^2\big)\cdot10x$$
          3. **الحد الثاني:** الخارج $\tanh^{-1}$، والداخل $\sin x$ ومشتقته $\cos x$. القانون: مشتقة الداخل على (1 ناقص مربعه)، بدون جذر:
             $$\frac{d}{dx}\tanh^{-1}(\sin x)=\frac{\cos x}{1-\sin^2x}$$
          4. **نبسّط:** $1-\sin^2x=\cos^2x$، ونشطب $\cos x$ لأنه عامل فوق وتحت:
             $$\frac{\cos x}{\cos^2x}=\frac{1}{\cos x}=\sec x$$
        answer: |-
          y'=-10x\sech\big(5x^2\big)\tanh\big(5x^2\big)+\sec x
        domain: '\cos x\ne0'
        domain_why: 'لأن $\tanh^{-1}(\sin x)$ يبي $\lvert\sin x\rvert<1$.'
        note: |
          المفتاح وقف عند $\dfrac{\cos x}{1-\sin^2x}$ بدون تبسيط، وهو نفس الجواب.
        check:
          kind: deriv
          f: 'sech(5*x**2) + atanh(sin(x))'
          ans: '-10*x*sech(5*x**2)*tanh(5*x**2) + sec(x)'
          samples: [0.3, -1.0, 2.5, 4.0]

      - id: M451-1-1
        marks: 2
        page: 5
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\cosh\big(3x^2\big)+\sech^{-1}(2x)'
        solution: |
          1. **الحد الأول:** الخارج $\cosh$، والداخل $3x^2$ ومشتقته $6x$. مشتقة $\cosh$ هي $\sinh$ **بدون سالب** (بعكس $\cos$):
             $$\frac{d}{dx}\cosh\big(3x^2\big)=\sinh\big(3x^2\big)\cdot6x$$
          2. **الحد الثاني:** الخارج $\sech^{-1}$، والداخل $2x$ ومشتقته 2. القانون فيه سالب، والداخل مضروب برّا الجذر:
             $$\frac{d}{dx}\sech^{-1}(2x)=\frac{-2}{2x\sqrt{1-(2x)^2}}$$
          3. **نبسّط:** نربّع $2x$، ونشطب 2 لأنه عامل فوق وتحت:
             $$\frac{-2}{2x\sqrt{1-4x^2}}=\frac{-1}{x\sqrt{1-4x^2}}$$
        answer: |-
          y'=6x\sinh\big(3x^2\big)-\frac{1}{x\sqrt{1-4x^2}}
        domain: '0<x<\tfrac12'
        domain_why: 'لأن $\sech^{-1}(2x)$ يبي $0<2x<1$.'
        check:
          kind: deriv
          f: 'cosh(3*x**2) + asech(2*x)'
          ans: '6*x*sinh(3*x**2) - 1/(x*sqrt(1-4*x**2))'
          samples: [0.05, 0.2, 0.45]

      - id: M452-1-1
        marks: 2
        page: 22
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\tanh\big(2x^3\big)+\sech^{-1}(3x)'
        solution: |
          1. **الحد الأول:** الخارج $\tanh$، والداخل $2x^3$ ومشتقته $6x^2$. مشتقة $\tanh$ هي $\sech^2$:
             $$\frac{d}{dx}\tanh\big(2x^3\big)=\sech^2\big(2x^3\big)\cdot6x^2$$
          2. **الحد الثاني:** الخارج $\sech^{-1}$، والداخل $3x$ ومشتقته 3. والـ 3 تنشطب فوق وتحت:
             $$\frac{d}{dx}\sech^{-1}(3x)=\frac{-3}{3x\sqrt{1-9x^2}}=\frac{-1}{x\sqrt{1-9x^2}}$$
        answer: |-
          y'=6x^2\sech^2\big(2x^3\big)-\frac{1}{x\sqrt{1-9x^2}}
        domain: '0<x<\tfrac13'
        domain_why: 'لأن $\sech^{-1}(3x)$ يبي $0<3x<1$.'
        check:
          kind: deriv
          f: 'tanh(2*x**3) + asech(3*x)'
          ans: '6*x**2*sech(2*x**3)**2 - 1/(x*sqrt(1-9*x**2))'
          samples: [0.05, 0.15, 0.3]

      - id: M461-1-1
        marks: 2
        page: 5
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\csch\Big(\frac{2}{x}\Big)+\tanh^{-1}\big(e^{5x}\big)'
        solution: |
          1. **الحد الأول:** الخارج $\csch$، والداخل $\frac2x=2x^{-1}$ ومشتقته $-2x^{-2}=-\frac{2}{x^2}$. مشتقة $\csch$ فيها سالب:
             $$\frac{d}{dx}\csch\frac2x=-\csch\frac2x\,\coth\frac2x\cdot\Big(-\frac{2}{x^2}\Big)$$
          2. **الإشارة:** سالب في سالب = موجب:
             $$=\frac{2}{x^2}\csch\frac2x\,\coth\frac2x$$
          3. **الحد الثاني:** الخارج $\tanh^{-1}$، والداخل $e^{5x}$ ومشتقته $5e^{5x}$، ومربعه $e^{10x}$ (أس على أس نضرب):
             $$\frac{d}{dx}\tanh^{-1}\big(e^{5x}\big)=\frac{5e^{5x}}{1-e^{10x}}$$
        answer: |-
          y'=\frac{2}{x^2}\csch\Big(\frac2x\Big)\coth\Big(\frac2x\Big)+\frac{5e^{5x}}{1-e^{10x}}
        domain: 'x<0'
        domain_why: 'لأن $\tanh^{-1}\big(e^{5x}\big)$ يبي $e^{5x}<1$، يعني $5x<0$.'
        check:
          kind: deriv
          f: 'csch(2/x) + atanh(exp(5*x))'
          ans: '2/x**2*csch(2/x)*coth(2/x) + 5*exp(5*x)/(1-exp(10*x))'
          samples: [-0.3, -1.0, -2.5]

      - id: M461-1-2
        marks: 2
        page: 5
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\sinh^{-1}\big(\sqrt{x}\big)+\coth\big(4x^2\big)'
        solution: |
          1. **الحد الأول:** الخارج $\sinh^{-1}$، والداخل $\sqrt x$: مشتقته $\frac{1}{2\sqrt x}$، ومربعه $x$:
             $$\frac{d}{dx}\sinh^{-1}\sqrt x=\frac{\frac{1}{2\sqrt x}}{\sqrt{1+x}}=\frac{1}{2\sqrt x\,\sqrt{1+x}}$$
          2. **الحد الثاني:** الخارج $\coth$، والداخل $4x^2$ ومشتقته $8x$. مشتقة $\coth$ هي $-\csch^2$:
             $$\frac{d}{dx}\coth\big(4x^2\big)=-\csch^2\big(4x^2\big)\cdot8x$$
        answer: |-
          y'=\frac{1}{2\sqrt{x}\,\sqrt{1+x}}-8x\csch^2\big(4x^2\big)
        domain: 'x>0'
        check:
          kind: deriv
          f: 'asinh(sqrt(x)) + coth(4*x**2)'
          ans: '1/(2*sqrt(x)*sqrt(1+x)) - 8*x*csch(4*x**2)**2'
          samples: [0.2, 0.7, 2.0]

      - id: M462-1-2
        marks: 2
        page: 21
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\coth^{-1}\Big(\frac{x^3}{3}\Big)+\cosh^{-1}(3x)'
        solution: |
          1. **الحد الأول:** الخارج $\coth^{-1}$، والداخل $\frac{x^3}{3}$: مشتقته $x^2$، ومربعه $\frac{x^6}{9}$. قانون $\coth^{-1}$ نفس قانون $\tanh^{-1}$، **بدون سالب**:
             $$\frac{d}{dx}\coth^{-1}\frac{x^3}{3}=\frac{x^2}{1-\frac{x^6}{9}}$$
          2. **كسر داخل كسر:** نضرب فوق وتحت في 9، والقيمة ما تتغير:
             $$\frac{x^2}{1-\frac{x^6}{9}}\cdot\frac99=\frac{9x^2}{9-x^6}$$
          3. **الحد الثاني:** الخارج $\cosh^{-1}$، والداخل $3x$ ومشتقته 3. تحت الجذر المربع ناقص 1:
             $$\frac{d}{dx}\cosh^{-1}(3x)=\frac{3}{\sqrt{9x^2-1}}$$
        answer: |-
          y'=\frac{9x^2}{9-x^6}+\frac{3}{\sqrt{9x^2-1}}
        domain: 'x>\sqrt[3]{3}'
        domain_why: 'لأن $\cosh^{-1}(3x)$ يبي $3x>1$، و$\coth^{-1}\frac{x^3}{3}$ يبي $\lvert x^3\rvert>3$. الاثنين مع بعض: $x>\sqrt[3]3$.'
        check:
          kind: deriv
          f: 'acoth(x**3/3) + acosh(3*x)'
          ans: '9*x**2/(9-x**6) + 3/sqrt(9*x**2-1)'
          samples: [1.5, 2.0, 3.0]

      - id: M471-1-1
        marks: 2
        page: 5
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\sinh\big(\sqrt{x^2+1}\big)+\cosh^{-1}\big(e^{x}\big)'
        solution: |
          1. **الحد الأول:** الخارج $\sinh$، والداخل جذر. مشتقة الجذر = مشتقة اللي تحته على ضعف الجذر:
             $$\big(\sqrt{x^2+1}\big)'=\frac{2x}{2\sqrt{x^2+1}}=\frac{x}{\sqrt{x^2+1}}$$
             $$\frac{d}{dx}\sinh\sqrt{x^2+1}=\cosh\sqrt{x^2+1}\cdot\frac{x}{\sqrt{x^2+1}}$$
          2. **الحد الثاني:** الخارج $\cosh^{-1}$، والداخل $e^x$: مشتقته $e^x$، ومربعه $e^{2x}$:
             $$\frac{d}{dx}\cosh^{-1}\big(e^x\big)=\frac{e^x}{\sqrt{e^{2x}-1}}$$
        answer: |-
          y'=\frac{x\cosh\sqrt{x^2+1}}{\sqrt{x^2+1}}+\frac{e^{x}}{\sqrt{e^{2x}-1}}
        domain: 'x>0'
        domain_why: 'لأن $\cosh^{-1}\big(e^x\big)$ يبي $e^x>1$.'
        check:
          kind: deriv
          f: 'sinh(sqrt(x**2+1)) + acosh(exp(x))'
          ans: 'x*cosh(sqrt(x**2+1))/sqrt(x**2+1) + exp(x)/sqrt(exp(2*x)-1)'
          samples: [0.2, 1.0, 2.0]

      - id: M472-1-1
        marks: 1
        page: 20
        prompt: 'Find the derivative.'
        q: 'f(x)=\sinh^{-1}\big(\ln|x+1|\big)'
        solution: |
          1. **دالة وحدة:** الخارج $\sinh^{-1}$، والداخل $\ln|x+1|$ ومشتقته $\frac{1}{x+1}$. الداخل يبقى زي ما هو داخل الجذر:
             $$f'(x)=\frac{\frac{1}{x+1}}{\sqrt{1+\big(\ln|x+1|\big)^2}}$$
          2. **نرتّب:** ننزّل $x+1$ للمقام.
        answer: |-
          f'(x)=\frac{1}{(x+1)\sqrt{1+\big(\ln|x+1|\big)^2}}
        domain: 'x\ne-1'
        check:
          kind: deriv
          f: 'asinh(log(Abs(x+1)))'
          ans: '1/((x+1)*sqrt(1+log(Abs(x+1))**2))'
          samples: [-3.0, -1.5, -0.5, 2.0]

      - id: M472-1-2
        marks: 1
        page: 20
        prompt: 'Find the derivative.'
        q: 'g(x)=\csch^{-1}\big(\sqrt{x+2}\big)'
        solution: |
          1. **القانون فيه القيمة المطلقة للداخل.** الداخل $\sqrt{x+2}$ موجب، فقيمته المطلقة هو نفسه. مشتقته $\frac{1}{2\sqrt{x+2}}$، ومربعه $x+2$:
             $$g'(x)=\frac{-\frac{1}{2\sqrt{x+2}}}{\sqrt{x+2}\,\sqrt{1+x+2}}$$
          2. **نبسّط:** جذر في نفسه = اللي تحته، و$1+x+2=x+3$:
             $$\sqrt{x+2}\cdot\sqrt{x+2}=x+2$$
        answer: |-
          g'(x)=\frac{-1}{2(x+2)\sqrt{x+3}}
        domain: 'x>-2'
        check:
          kind: deriv
          f: 'acsch(sqrt(x+2))'
          ans: '-1/(2*(x+2)*sqrt(x+3))'
          samples: [-1.5, 0.0, 3.0]

  - key: D2
    title: 'طبقة فوق الدالة: قوة أو ln'
    questions:
      - id: M451-1-2
        marks: 2
        page: 5
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\coth^{-1}(3x)+\tanh^2\sqrt{2x}'
        solution: |
          1. **الحد الأول:** الخارج $\coth^{-1}$، والداخل $3x$ ومشتقته 3. قانونه نفس $\tanh^{-1}$ بالضبط، **بدون سالب**:
             $$\frac{d}{dx}\coth^{-1}(3x)=\frac{3}{1-(3x)^2}=\frac{3}{1-9x^2}$$
          2. **الحد الثاني: رتّب الطبقات من برّا لجوّا.** التربيع أبعد طبقة، بعده $\tanh$، بعده الجذر:
             $$\tanh^2\sqrt{2x}=\Big(\tanh\sqrt{2x}\Big)^2$$
          3. **مشتقة الجذر على جنب:** مشتقة اللي تحته (2) على ضعف الجذر:
             $$\big(\sqrt{2x}\big)'=\frac{2}{2\sqrt{2x}}=\frac{1}{\sqrt{2x}}$$
          4. **كل طبقة تعطي عامل:** التربيع يعطي $2\tanh\sqrt{2x}$، و$\tanh$ يعطي $\sech^2\sqrt{2x}$، والجذر يعطي مشتقته:
             $$\frac{d}{dx}\Big(\tanh\sqrt{2x}\Big)^2=2\tanh\sqrt{2x}\cdot\sech^2\sqrt{2x}\cdot\frac{1}{\sqrt{2x}}$$
        answer: |-
          y'=\frac{3}{1-9x^2}+\frac{2\tanh\sqrt{2x}\,\sech^2\sqrt{2x}}{\sqrt{2x}}
        domain: 'x>\tfrac13'
        domain_why: 'لأن $\sqrt{2x}$ يبي $x\ge0$، و$\coth^{-1}(3x)$ يبي $\lvert3x\rvert>1$.'
        fix: |
          المفتاح كتب $\dfrac{-3}{1-9x^2}$، لأن المذكرة (ص58) كاتبة قانون $\coth^{-1}$ بسالب زايد. الصحيح بدون سالب. وقيمته تطلع سالبة على المجال لأن $1-9x^2<0$، بس هذا من المقام نفسه، فما نضيف سالب ثاني.
        check:
          kind: deriv
          f: 'acoth(3*x) + tanh(sqrt(2*x))**2'
          ans: '3/(1-9*x**2) + 2*tanh(sqrt(2*x))*sech(sqrt(2*x))**2/sqrt(2*x)'
          samples: [0.4, 1.0, 3.0]
          key_wrong: '-3/(1-9*x**2) + 2*tanh(sqrt(2*x))*sech(sqrt(2*x))**2/sqrt(2*x)'

      - id: M452-1-2
        marks: 2
        page: 22
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\cosh^{-1}\big(\sqrt{x}\big)+\sinh^3\Big(\frac{1}{x}\Big)'
        solution: |
          1. **الحد الأول:** الخارج $\cosh^{-1}$، والداخل $\sqrt x$: مشتقته $\frac{1}{2\sqrt x}$، ومربعه $x$. تحت الجذر المربع ناقص 1:
             $$\frac{d}{dx}\cosh^{-1}\sqrt x=\frac{\frac{1}{2\sqrt x}}{\sqrt{x-1}}=\frac{1}{2\sqrt x\,\sqrt{x-1}}$$
          2. **الحد الثاني: ثلاث طبقات.** التكعيب، بعده $\sinh$، بعده $\frac1x$:
             $$\sinh^3\frac1x=\Big(\sinh\frac1x\Big)^3,\qquad\Big(\frac1x\Big)'=-\frac{1}{x^2}$$
          3. **كل طبقة تعطي عامل:** التكعيب يعطي $3\sinh^2\frac1x$، و$\sinh$ يعطي $\cosh\frac1x$، والداخل يعطي مشتقته:
             $$\frac{d}{dx}\Big(\sinh\frac1x\Big)^3=3\sinh^2\frac1x\cdot\cosh\frac1x\cdot\Big(-\frac{1}{x^2}\Big)$$
        answer: |-
          y'=\frac{1}{2\sqrt{x}\,\sqrt{x-1}}-\frac{3}{x^2}\sinh^2\Big(\frac1x\Big)\cosh\Big(\frac1x\Big)
        domain: 'x>1'
        domain_why: 'لأن مشتقة $\cosh^{-1}\sqrt x$ تبي $\sqrt x>1$.'
        check:
          kind: deriv
          f: 'acosh(sqrt(x)) + sinh(1/x)**3'
          ans: '1/(2*sqrt(x)*sqrt(x-1)) - 3/x**2*sinh(1/x)**2*cosh(1/x)'
          samples: [1.2, 2.0, 5.0]

  - key: D3
    title: 'الداخل مقلوب'
    questions:
      - id: M462-1-1
        marks: 2
        page: 21
        prompt: 'Find $\dfrac{dy}{dx}$.'
        q: 'y=\coth\big(\sqrt[3]{x}\big)+\csch^{-1}\Big(\frac{2}{x}\Big)'
        solution: |
          1. **الحد الأول:** الخارج $\coth$، والداخل $\sqrt[3]x=x^{1/3}$ ومشتقته $\frac13x^{-2/3}$. مشتقة $\coth$ هي $-\csch^2$:
             $$\frac{d}{dx}\coth\sqrt[3]x=-\csch^2\sqrt[3]x\cdot\frac{1}{3\sqrt[3]{x^2}}$$
          2. **الحد الثاني: اقلب قبل لا تشتق.** الداخل مقلوب، و$\csch^{-1}w=\sinh^{-1}\frac1w$ لأي $w\ne0$. ليش؟ $\csch=\frac{1}{\sinh}$، فلو $\csch y=\frac2x$ فإن $\sinh y=\frac x2$:
             $$\csch^{-1}\frac2x=\sinh^{-1}\frac x2$$
          3. **نشتق بقانون $\sinh^{-1}$:** أسهل، وما فيه قيمة مطلقة. الداخل $\frac x2$ ومشتقته $\frac12$:
             $$\frac{d}{dx}\sinh^{-1}\frac x2=\frac{\frac12}{\sqrt{1+\frac{x^2}{4}}}$$
          4. **نبسّط الجذر:** نوحّد المقام داخله، وجذر 4 يطلع 2، فالنص تنشطب:
             $$\sqrt{1+\frac{x^2}{4}}=\frac{\sqrt{x^2+4}}{2}\quad\Rightarrow\quad\frac{\frac12}{\frac12\sqrt{x^2+4}}=\frac{1}{\sqrt{x^2+4}}$$
        answer: |-
          y'=-\frac{\csch^2\sqrt[3]{x}}{3\sqrt[3]{x^2}}+\frac{1}{\sqrt{x^2+4}}
        domain: 'x\ne0'
        fix: |
          جواب المفتاح للحد الثاني $\dfrac{1}{x\sqrt{\frac{4}{x^2}+1}}$، وهذا يصح بس لما $x>0$؛ لما $x<0$ إشارته تطلع غلط، لأنه حط الداخل مكان قيمته المطلقة في قانون $\csch^{-1}$. القلب يتفادى المشكلة كلها.
        more: |
          بالقانون مباشرة لازم القيمة المطلقة، و$|x|\cdot|x|=x^2$:
          $$\frac{-\big(-\frac{2}{x^2}\big)}{\frac{2}{|x|}\cdot\frac{\sqrt{x^2+4}}{|x|}}=\frac{1}{\sqrt{x^2+4}}$$
        check:
          kind: deriv
          f: 'coth(sign(x)*Abs(x)**Rational(1,3)) + acsch(2/x)'
          ans: '-csch(sign(x)*Abs(x)**Rational(1,3))**2/(3*Abs(x)**Rational(2,3)) + 1/sqrt(x**2+4)'
          samples: [-2.0, -0.5, 0.5, 3.0]
          key_wrong: '-csch(sign(x)*Abs(x)**Rational(1,3))**2/(3*Abs(x)**Rational(2,3)) + 1/(x*sqrt(4/x**2+1))'
          key_valid_on: [0.5, 3.0]
          key_invalid_on: [-2.0, -0.5]
