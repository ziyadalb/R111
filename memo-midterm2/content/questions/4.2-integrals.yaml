# القسم 4.2: تكاملات جوابها دالة زائدية عكسية (أسئلة الفصلي الثاني)
# بدون u وdu: القوانين مكتوبة بـ f(x) مثل المذكرة. نحدد f (الشي المربّع)، ونشيك إن مشتقته موجودة، ونقرأ الجواب من الجدول.
# الإكمال بسطر: القوس من نص معامل x، والثابت = قيمة العبارة عند الرقم اللي يصفّر القوس.
section: '4.2'
slug: i42
title: 'الدوال الزائدية العكسية: التكاملات'
patterns:
  - key: I1
    title: 'إكمال المربع تحت جذر لحاله'
    questions:
      - id: M452-2-7
        marks: 2
        page: 24
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{x^2+6x+13}}'
        solution: |
          1. **فيه حد خطي ($6x$) تحت الجذر، فنكمّل المربع.** نص معامل $x$ هو 3، فالقوس $(x+3)$. والثابت = قيمة العبارة لما $x=-3$ (الرقم اللي يصفّر القوس):
             $$9-18+13=4\quad\Rightarrow\quad x^2+6x+13=(x+3)^2+2^2$$
          2. **نقرأ الشكل:** جذر لحاله، وجمع: هذا شكل $\sinh^{-1}$. والمربّع $f=x+3$، ومشتقته 1، يعني موجودة (هي الـ $dx$ نفسها):
             $$\int\frac{f'}{\sqrt{f^2+a^2}}\,dx=\sinh^{-1}\frac fa+C$$
          3. **نعوّض مباشرة** $f=x+3$ و$a=2$.
        answer: |-
          \sinh^{-1}\Big(\frac{x+3}{2}\Big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: '1/sqrt(x**2+6*x+13)'
          ans: 'asinh((x+3)/2)'
          samples: [-7.0, -3.0, 0.0, 4.0]
          identities:
            - ['x**2+6*x+13', '(x+3)**2+4']

      - id: M462-2-2
        marks: 2
        page: 21
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{x^2+2x+10}}'
        solution: |
          1. **نكمّل المربع:** نص 2 هو 1، فالقوس $(x+1)$. والثابت = القيمة لما $x=-1$:
             $$1-2+10=9\quad\Rightarrow\quad x^2+2x+10=(x+1)^2+3^2$$
          2. **جذر لحاله وجمع:** $\sinh^{-1}$، مع $f=x+1$ (مشتقته 1) و$a=3$.
        answer: |-
          \sinh^{-1}\Big(\frac{x+1}{3}\Big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: '1/sqrt(x**2+2*x+10)'
          ans: 'asinh((x+1)/3)'
          samples: [-6.0, -1.0, 2.0, 7.0]
          identities:
            - ['x**2+2*x+10', '(x+1)**2+9']

      - id: M461-2-2
        marks: 3
        page: 5
        prompt: 'Evaluate the integral.'
        q: '\int\frac{3}{\sqrt{x^2+6x-16}}\,dx'
        solution: |
          1. **الـ 3 ثابت، يطلع برّا.** ونكمّل المربع: القوس $(x+3)$، والثابت = القيمة لما $x=-3$:
             $$9-18-16=-25\quad\Rightarrow\quad x^2+6x-16=(x+3)^2-5^2$$
          2. **جذر لحاله، وطرح، والمربّع أول:** هذا شكل $\cosh^{-1}$. بس $\cosh^{-1}$ تشتغل بس لما $f>a$، وهنا $f=x+3$ ممكن يكون أقل من $-5$. فناخذ الصيغة اللي تصح على الجهتين:
             $$\int\frac{f'}{\sqrt{f^2-a^2}}\,dx=\ln\Big|f+\sqrt{f^2-a^2}\Big|+C$$
          3. **نعوّض** $f=x+3$. واللي تحت الجذر $f^2-a^2$ هو نفسه الأصلي $x^2+6x-16$.
        answer: |-
          3\ln\Big|x+3+\sqrt{x^2+6x-16}\Big|+C
        domain: 'x\in(-\infty,-8)\cup(2,\infty)'
        domain_why: 'لأن اللي تحت الجذر لازم موجب: $(x+3)^2>25$.'
        fix: |
          المفتاح كتب $3\cosh^{-1}\big(\frac{x+3}{5}\big)+c$. هذا يصح بس لما $x>2$، لأن $\cosh^{-1}$ ما تقبل إلا $\ge1$، والسؤال يسمح بعد بـ $x<-8$.
        note: |
          لو شغلك على جهة $x>2$ بس، جواب المفتاح نفس جوابنا: الفرق ثابت ($3\ln5$) يدخل في $C$.
        check:
          kind: indef
          f: '3/sqrt(x**2+6*x-16)'
          ans: '3*log(Abs(x+3+sqrt(x**2+6*x-16)))'
          samples: [-12.0, -9.0, 2.5, 6.0]
          identities:
            - ['x**2+6*x-16', '(x+3)**2-25']
          key_wrong: '3*acosh((x+3)/5)'
          key_valid_on: [2.5, 6.0]
          key_invalid_on: [-12.0, -9.0]

  - key: I2
    title: 'إكمال المربع، و(x − c) برّا الجذر'
    questions:
      - id: M471-2-4
        marks: 3
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{(x-3)\sqrt{7-x^2+6x}}'
        solution: |
          1. **نكمّل المربع تحت الجذر.** حدود $x$ هي $-x^2+6x$: بعد ما نطلّع إشارة $x^2$ تصير $x^2-6x$، ونص $-6$ هو $-3$، فالقوس $(x-3)$. والثابت = القيمة لما $x=3$، والمربّع ياخذ إشارة $x^2$ (سالب):
             $$7-9+18=16\quad\Rightarrow\quad7-x^2+6x=4^2-(x-3)^2$$
          2. **نقرأ الشكل:** نفس $(x-3)$ مضروب برّا الجذر، يعني $f$ برّا الجذر، وتحته $a^2-f^2$: هذا شكل $\sech^{-1}$. و$f=x-3$ مشتقته 1، موجودة:
             $$\int\frac{f'}{f\sqrt{a^2-f^2}}\,dx=-\frac1a\sech^{-1}\frac{|f|}{a}+C$$
          3. **نعوّض** $f=x-3$ و$a=4$. القيمة المطلقة لازم، لأن $x-3$ ممكن يكون سالب.
        answer: |-
          -\frac14\sech^{-1}\Big(\frac{|x-3|}{4}\Big)+C
        domain: '0<|x-3|<4'
        domain_why: 'يعني $-1<x<7$، و$x\ne3$.'
        fix: |
          المفتاح كتب $\sech^{-1}\big(\frac{x-3}{4}\big)$ بدون قيمة مطلقة، وهذا يصح بس لما $x>3$. قانون المذكرة نفسه (ص60) فيه $|f(x)|$.
        check:
          kind: indef
          f: '1/((x-3)*sqrt(7-x**2+6*x))'
          ans: '-asech(Abs(x-3)/4)/4'
          samples: [-0.5, 1.0, 2.5, 3.5, 5.0, 6.5]
          identities:
            - ['7-x**2+6*x', '16-(x-3)**2']
          key_wrong: '-asech((x-3)/4)/4'
          key_valid_on: [3.5, 5.0, 6.5]
          key_invalid_on: [-0.5, 1.0, 2.5]

      - id: M472-3-4
        marks: 2
        page: 22
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{(x-2)\sqrt{-x^2+4x-2}}'
        solution: |
          1. **نكمّل المربع:** القوس $(x-2)$، والثابت = القيمة لما $x=2$، والمربّع سالب:
             $$-4+8-2=2\quad\Rightarrow\quad-x^2+4x-2=2-(x-2)^2$$
          2. **$f=x-2$ برّا الجذر، وتحته $a^2-f^2$:** شكل $\sech^{-1}$. وانتبه: $a^2=2$ يعني $a=\sqrt2$، مو 2:
             $$\int\frac{f'}{f\sqrt{a^2-f^2}}\,dx=-\frac1a\sech^{-1}\frac{|f|}{a}+C$$
        answer: |-
          -\frac{1}{\sqrt2}\sech^{-1}\Big(\frac{|x-2|}{\sqrt2}\Big)+C
        domain: '0<|x-2|<\sqrt2'
        fix: |
          المفتاح كتب $\sech^{-1}\big(\frac{x-2}{\sqrt2}\big)$ بدون قيمة مطلقة، وهذا يصح بس لما $x>2$.
        check:
          kind: indef
          f: '1/((x-2)*sqrt(-x**2+4*x-2))'
          ans: '-asech(Abs(x-2)/sqrt(2))/sqrt(2)'
          samples: [0.8, 1.5, 2.5, 3.2]
          identities:
            - ['-x**2+4*x-2', '2-(x-2)**2']
          key_wrong: '-asech((x-2)/sqrt(2))/sqrt(2)'
          key_valid_on: [2.5, 3.2]
          key_invalid_on: [0.8, 1.5]

  - key: I3
    title: 'المشتقة موجودة: اقرأ القانون'
    questions:
      - id: M451-2-7
        marks: 3
        page: 8
        prompt: 'Evaluate the integral.'
        q: '\int\frac{\sin x}{4-\cos^2x}\,dx'
        solution: |
          1. **وش المربّع؟** $\cos^2x=(\cos x)^2$، فـ $f=\cos x$، ومشتقته $-\sin x$. وفوق $\sin x$، يعني المشتقة موجودة ناقصها سالب بس:
             $$\sin x=-(\cos x)'$$
          2. **نقرأ الشكل:** ما فيه جذر، والثابت أول وبعده طرح ($a^2-f^2$): هذا شكل $\tanh^{-1}$، وشرطه $|f|<a$. هنا $|\cos x|\le1<2$، فالشرط متحقق دايم:
             $$\int\frac{f'}{a^2-f^2}\,dx=\frac1a\tanh^{-1}\frac fa+C$$
          3. **نطلّع السالب ونعوّض** $f=\cos x$ و$a=2$:
             $$\int\frac{\sin x}{4-\cos^2x}\,dx=-\int\frac{(\cos x)'}{2^2-\cos^2x}\,dx=-\frac12\tanh^{-1}\frac{\cos x}{2}+C$$
        answer: |-
          -\frac12\tanh^{-1}\Big(\frac{\cos x}{2}\Big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)/(4-cos(x)**2)'
          ans: '-atanh(cos(x)/2)/2'
          samples: [-2.0, 0.3, 1.5, 4.0]

      - id: M472-3-2
        marks: 1
        page: 21
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{x\sqrt{(\ln|x|)^2-1}}'
        solution: |
          1. **وش المربّع؟** $f=\ln|x|$، ومشتقته $\frac1x$، وموجودة: $\frac{dx}{x}$.
          2. **جذر لحاله، وطرح، والمربّع أول ($a=1$):** شكل $\cosh^{-1}$. بس $\ln|x|$ ممكن يكون أقل من $-1$، فناخذ الصيغة اللي تصح على الجهتين:
             $$\int\frac{f'}{\sqrt{f^2-a^2}}\,dx=\ln\Big|f+\sqrt{f^2-a^2}\Big|+C$$
          3. **نعوّض** $f=\ln|x|$.
        answer: |-
          \ln\Big|\ln|x|+\sqrt{(\ln|x|)^2-1}\Big|+C
        domain: '\big|\ln|x|\big|>1'
        domain_why: 'يعني $|x|>e$ أو $0<|x|<\frac1e$.'
        fix: |
          المفتاح كتب $\cosh^{-1}(\ln|x|)+c$، وهذا يصح بس لما $\ln|x|>1$. السؤال يسمح بعد بـ $\ln|x|<-1$، وهناك $\cosh^{-1}$ ما تنفع.
        note: |
          لو شغلك على جهة $\ln|x|>1$ بس، $\cosh^{-1}(\ln|x|)$ هي نفس جوابنا بالضبط (لأن $a=1$).
        check:
          kind: indef
          f: '1/(x*sqrt(log(Abs(x))**2-1))'
          ans: 'log(Abs(log(Abs(x)) + sqrt(log(Abs(x))**2-1)))'
          samples: [-20.0, -0.1, 0.05, 0.2, 5.0, 30.0]
          key_wrong: 'acosh(log(Abs(x)))'
          key_valid_on: [5.0, 30.0, -20.0]
          key_invalid_on: [0.05, 0.2, -0.1]

      - id: M451-2-2
        marks: 2
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{x}\,\sqrt{1+x}}'
        solution: |
          1. **وش المربّع؟** $x=\big(\sqrt x\big)^2$، فـ $f=\sqrt x$، ومشتقته $\frac{1}{2\sqrt x}$. والسؤال فيه $\frac{1}{\sqrt x}$، يعني ضعف المشتقة:
             $$\frac{1}{\sqrt x}=2\cdot\frac{1}{2\sqrt x}=2f'$$
          2. **نقرأ الشكل:** جذر لحاله وجمع ($1+f^2$): $\sinh^{-1}$ مع $a=1$:
             $$\int\frac{dx}{\sqrt x\,\sqrt{1+x}}=2\int\frac{f'}{\sqrt{1+f^2}}\,dx=2\sinh^{-1}f+C$$
        answer: |-
          2\sinh^{-1}\big(\sqrt{x}\big)+C
        domain: 'x>0'
        note: |
          المفتاح ذكر حل ثاني جوابه $2\cosh^{-1}\sqrt{x+1}+c$. صحيح بعد، وهو نفس الدالة بالضبط (الاثنين يساوون $2\ln\big(\sqrt x+\sqrt{x+1}\big)$).
        check:
          kind: indef
          f: '1/(sqrt(x)*sqrt(1+x))'
          ans: '2*asinh(sqrt(x))'
          samples: [0.1, 1.0, 4.0]
          alt: ['2*acosh(sqrt(x+1))']

  - key: I4
    title: 'المشتقة ناقصة: اضرب فوق وتحت'
    questions:
      - id: M462-2-7
        marks: 2
        page: 23
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{e^{6x}+1}}'
        solution: |
          1. **وش المربّع؟** $e^{6x}=\big(e^{3x}\big)^2$، فـ $f=e^{3x}$، ومشتقته $3e^{3x}$. وفوق ما فيه شي، يعني المشتقة **ناقصة**.
          2. **نضرب فوق وتحت في $e^{3x}$:** فوق تطلع المشتقة (ناقصها 3)، وتحت يطلع $f$ برّا الجذر. والقيمة ما تتغير:
             $$\frac{1}{\sqrt{e^{6x}+1}}=\frac{e^{3x}}{e^{3x}\sqrt{e^{6x}+1}}=\frac13\cdot\frac{3e^{3x}}{e^{3x}\sqrt{\big(e^{3x}\big)^2+1}}$$
          3. **نقرأ الشكل:** $f$ برّا الجذر، وتحته جمع: $\csch^{-1}$ مع $a=1$. و$e^{3x}$ موجب دايم، فـ $|f|=f$:
             $$\int\frac{f'}{f\sqrt{a^2+f^2}}\,dx=-\frac1a\csch^{-1}\frac{|f|}{a}+C$$
        answer: |-
          -\frac13\csch^{-1}\big(e^{3x}\big)+C
        domain: 'x\in\mathbb{R}'
        note: |
          نفس الجواب تقدر تكتبه $-\frac13\sinh^{-1}\big(e^{-3x}\big)+C$، لأن $\csch^{-1}w=\sinh^{-1}\frac1w$.
        check:
          kind: indef
          f: '1/sqrt(exp(6*x)+1)'
          ans: '-acsch(exp(3*x))/3'
          samples: [-1.5, 0.0, 0.7, 1.4]
          alt: ['-asinh(exp(-3*x))/3']

      - id: M471-2-2
        marks: 2
        page: 5
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{5^{2x}+1}}'
        solution: |
          1. **وش المربّع؟** $5^{2x}=\big(5^x\big)^2$، فـ $f=5^x$، ومشتقته $5^x\ln5$ (الأسّية بأساس غير $e$ تجيب $\ln$ الأساس). والمشتقة ناقصة.
          2. **نضرب فوق وتحت في $5^x$:**
             $$\frac{1}{\sqrt{5^{2x}+1}}=\frac{1}{\ln5}\cdot\frac{5^x\ln5}{5^x\sqrt{\big(5^x\big)^2+1}}$$
          3. **$f$ برّا الجذر، وجمع:** $\csch^{-1}$ مع $a=1$، و$5^x>0$ فـ $|f|=f$.
        answer: |-
          -\frac{1}{\ln5}\csch^{-1}\big(5^{x}\big)+C
        domain: 'x\in\mathbb{R}'
        note: |
          شكل ثاني لنفس الجواب: $-\frac{1}{\ln5}\sinh^{-1}\big(5^{-x}\big)+C$.
        check:
          kind: indef
          f: '1/sqrt(5**(2*x)+1)'
          ans: '-acsch(5**x)/log(5)'
          samples: [-1.0, 0.0, 0.5, 1.2]
          alt: ['-asinh(5**(-x))/log(5)']

      - id: M452-2-4
        marks: 3
        page: 23
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{x\sqrt{x^6+25}}'
        solution: |
          1. **وش المربّع؟** $x^6=\big(x^3\big)^2$، فـ $f=x^3$، ومشتقته $3x^2$. وبرّا الجذر $x$ بس، مو $x^3$، والمشتقة ناقصة.
          2. **نضرب فوق وتحت في $x^2$:** فوق تطلع $x^2$ (ثلث المشتقة)، وتحت $x\cdot x^2=x^3=f$:
             $$\frac{1}{x\sqrt{x^6+25}}=\frac{x^2}{x^3\sqrt{x^6+25}}=\frac13\cdot\frac{3x^2}{x^3\sqrt{\big(x^3\big)^2+5^2}}$$
          3. **$f$ برّا الجذر، وجمع:** $\csch^{-1}$ مع $a=5$. و$x^3$ ممكن يكون سالب، فلازم $|f|=|x|^3$:
             $$\frac13\cdot\Big(-\frac15\Big)\csch^{-1}\frac{|x|^3}{5}+C$$
        answer: |-
          -\frac{1}{15}\csch^{-1}\Big(\frac{|x|^3}{5}\Big)+C
        domain: 'x\ne0'
        fix: |
          المفتاح كتب $\csch^{-1}\big(\frac{x^3}{5}\big)$ بدون قيمة مطلقة، وهذا يصح بس لما $x>0$. قانون المذكرة نفسه (ص60) فيه $|f(x)|$.
        note: |
          شكل ثاني لنفس الجواب: $-\frac{1}{15}\sinh^{-1}\Big(\frac{5}{|x|^3}\Big)+C$.
        check:
          kind: indef
          f: '1/(x*sqrt(x**6+25))'
          ans: '-acsch(Abs(x)**3/5)/15'
          samples: [-2.0, -0.6, 0.6, 2.0]
          alt: ['-asinh(5/Abs(x)**3)/15']
          key_wrong: '-acsch(x**3/5)/15'
          key_valid_on: [0.6, 2.0]
          key_invalid_on: [-2.0, -0.6]
