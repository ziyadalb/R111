# القسم 5.1: التكامل بالتجزئة (أسئلة الفصلي الثاني)
# الحلول بجدول التجزئة (@di): عمود «نشتق» وعمود «نكامل»، بدل u وdv.
# صيغة الجدول: @di نشتق & نكامل ;; نشتق & نكامل ... والصف اللي يبدأ بـ ! نكامل ضربه (نوقف عنده).
section: '5.1'
slug: s51
title: 'التكامل بالتجزئة'
patterns:
  - key: C1
    title: 'كثير حدود × (cos أو sinh أو cosh)'
    questions:
      - id: M452-2-2
        marks: 2
        page: 22
        prompt: 'Evaluate the integral.'
        q: '\int(2x+1)\cos x\,dx'
        solution: |
          1. **وش النمط؟** ضرب نوعين مختلفين: كثير حدود ($2x+1$) × دالة مثلثية ($\cos x$). هذا شغل التجزئة، ونسويها بالجدول.
          2. **وش نشتق؟** $2x+1$، لأن مشتقته رقم (2) وبعدها صفر، فيختفي $x$ ويخلص الشغل. ولو كاملناه بداله بتكبر درجته. و$\cos x$ نكاملها: $\sin x$ بعدين $-\cos x$:
             @di 2x+1 & \cos x ;; 2 & \sin x ;; 0 & -\cos x
          3. **نضرب قطريًا:** كل خانة في «نشتق» × اللي تحتها في «نكامل»، بإشارة صفها. وصف الصفر ما يعطي شي:
             $$+\,(2x+1)\cdot\sin x\;-\;2\cdot(-\cos x)$$
          4. سالب في سالب يصير موجب، فالجواب:
        answer: |-
          (2x+1)\sin x+2\cos x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: '(2*x+1)*cos(x)'
          ans: '(2*x+1)*sin(x) + 2*cos(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: M461-2-4
        marks: 2
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int(3x-2)\sinh x\,dx'
        solution: |
          1. كثير حدود × $\sinh x$: نشتق $3x-2$ لين صفر، ونكامل $\sinh x$. وتكامل $\sinh$ هو $\cosh$، وتكامل $\cosh$ هو $\sinh$، **بدون سالب** (عكس $\sin$ و$\cos$):
             @di 3x-2 & \sinh x ;; 3 & \cosh x ;; 0 & \sinh x
          2. نضرب قطريًا بالإشارات $+$ بعدين $-$:
             $$+\,(3x-2)\cosh x\;-\;3\sinh x$$
        answer: |-
          (3x-2)\cosh x-3\sinh x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: '(3*x-2)*sinh(x)'
          ans: '(3*x-2)*cosh(x) - 3*sinh(x)'
          samples: [-2.0, 0.5, 3.0]

      - id: M462-2-3
        marks: 2
        page: 22
        prompt: 'Evaluate the integral.'
        q: '\int(2x-1)\cosh x\,dx'
        solution: |
          1. نفس M461-2-4 بس $\cosh x$: نشتق $2x-1$، ونكامل $\cosh x$ (تكاملها $\sinh x$، وتكامل $\sinh x$ هو $\cosh x$):
             @di 2x-1 & \cosh x ;; 2 & \sinh x ;; 0 & \cosh x
          2. نضرب قطريًا بالإشارات $+$ بعدين $-$:
             $$+\,(2x-1)\sinh x\;-\;2\cosh x$$
        answer: |-
          (2x-1)\sinh x-2\cosh x+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: '(2*x-1)*cosh(x)'
          ans: '(2*x-1)*sinh(x) - 2*cosh(x)'
          samples: [-2.0, 0.5, 3.0]

  - key: C2
    title: 'قوة × لوغاريتم'
    questions:
      - id: M471-2-7
        marks: 2
        page: 7
        prompt: 'Evaluate the integral.'
        q: '\int x^3\ln|2x|\,dx'
        solution: |
          1. **وش النمط؟** قوة ($x^3$) × لوغاريتم، فنجزّئ بالجدول.
          2. **وش نشتق؟** اللوغاريتم. ليش؟ ما نعرف نكامل $\ln$ بسهولة، لكن مشتقته $\frac1x$ تمسحه. ومشتقة $\ln|2x|$ هي $\frac{2}{2x}=\frac1x$: الـ 2 تختصر. ونكامل $x^3$: نزيد الأس ونقسم عليه:
             @di \ln|2x| & x^3 ;; !\frac1x & \frac{x^4}{4}
          3. **ليش وقّفنا في الصف الثاني؟** مشتقات $\frac1x$ ما توصل صفر أبد. بس ضرب الصف الثاني صار سهل: $\frac1x\cdot\frac{x^4}{4}=\frac{x^3}{4}$. فنأخذ القطر، وبعده تكامل ضرب الصف الأخير بإشارته ($-$):
             $$\frac{x^4}{4}\ln|2x|-\int\frac{x^3}{4}\,dx$$
          4. نكامل $\frac{x^3}{4}$:
             $$\int\frac{x^3}{4}\,dx=\frac14\cdot\frac{x^4}{4}=\frac{x^4}{16}$$
        answer: |-
          \frac{x^4}{4}\ln|2x|-\frac{x^4}{16}+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: 'x**3*log(Abs(2*x))'
          ans: 'x**4/4*log(Abs(2*x)) - x**4/16'
          samples: [-2.0, -0.3, 0.4, 2.5]

      - id: M452-2-5
        marks: 2
        page: 23
        prompt: 'Evaluate the integral.'
        q: '\int x\ln|x|\,dx'
        solution: |
          1. قوة × $\ln$: نشتق $\ln|x|$ (مشتقته تمسحه)، ونكامل $x$، ونوقف في الصف الثاني:
             @di \ln|x| & x ;; !\frac1x & \frac{x^2}{2}
          2. القطر، ناقص تكامل ضرب الصف الأخير ($\frac1x\cdot\frac{x^2}{2}=\frac x2$):
             $$\frac{x^2}{2}\ln|x|-\int\frac x2\,dx=\frac{x^2}{2}\ln|x|-\frac{x^2}{4}$$
        answer: |-
          \frac{x^2}{2}\ln|x|-\frac{x^2}{4}+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: 'x*log(Abs(x))'
          ans: 'x**2/2*log(Abs(x)) - x**2/4'
          samples: [-2.0, -0.3, 0.4, 2.5]

      - id: M461-2-5
        marks: 2
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int x^{-2}\ln x\,dx'
        solution: |
          1. قوة × $\ln$، والأس سالب. نشتق $\ln x$، ونكامل $x^{-2}$: نزيد الأس واحد (يصير $-1$) ونقسم عليه، فيطلع $-\frac1x$:
             @di \ln x & x^{-2} ;; !\frac1x & -\frac1x
          2. القطر، ناقص تكامل ضرب الصف الأخير ($-\frac{1}{x^2}$). وناقص في ناقص يصير زائد:
             $$-\frac{\ln x}{x}-\int\Big(-\frac{1}{x^2}\Big)dx=-\frac{\ln x}{x}+\int x^{-2}\,dx$$
          3. و$\int x^{-2}dx=-\frac1x$:
             $$-\frac{\ln x}{x}-\frac1x$$
        answer: |-
          -\frac{\ln x}{x}-\frac1x+C
        domain: 'x>0'
        check:
          kind: indef
          f: 'log(x)/x**2'
          ans: '-log(x)/x - 1/x'
          samples: [0.3, 1.5, 4.0]

      - id: M451-2-3
        marks: 2
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int_1^e x^3\ln x\,dx'
        solution: |
          1. قوة × $\ln$ بحدود. نطلّع التكامل بدون حدود أول، بالجدول (نشتق $\ln x$ ونكامل $x^3$):
             @di \ln x & x^3 ;; !\frac1x & \frac{x^4}{4}
          2. القطر، ناقص تكامل ضرب الصف الأخير ($\frac{x^3}{4}$، وتكامله $\frac{x^4}{16}$):
             $$F(x)=\frac{x^4}{4}\ln x-\frac{x^4}{16}$$
          3. نعوّض الحدود. $\ln e=1$ و$\ln1=0$:
             $$F(e)=\frac{e^4}{4}-\frac{e^4}{16}=\frac{3e^4}{16},\qquad F(1)=0-\frac1{16}$$
          4. الأعلى ناقص الأدنى:
             $$F(e)-F(1)=\frac{3e^4}{16}+\frac1{16}$$
        answer: |-
          \frac{3e^4+1}{16}
        check:
          kind: def
          f: 'x**3*log(x)'
          a: '1'
          b: 'E'
          ans: '(3*E**4+1)/16'

  - key: C3
    title: 'دالة عكسية لحالها، أو × x'
    questions:
      - id: M462-2-8
        marks: 3
        page: 23
        prompt: 'Evaluate the integral.'
        q: '\int\tan^{-1}x\,dx'
        solution: |
          1. **وش النمط؟** دالة عكسية لحالها. ما لها تكامل نحفظه، بس مشتقتها كسر عادي. فنعتبرها مضروبة في 1، ونجزّئ.
          2. **الجدول:** نشتق $\tan^{-1}x$ (مشتقتها $\frac{1}{1+x^2}$)، ونكامل الواحد (يصير $x$). ونوقف في الصف الثاني لأن ضربه $\frac{x}{1+x^2}$ نعرف نكامله:
             @di \tan^{-1}x & 1 ;; !\frac{1}{1+x^2} & x
          3. القطر، ناقص تكامل ضرب الصف الأخير:
             $$x\tan^{-1}x-\int\frac{x}{1+x^2}\,dx$$
          4. **الباقي بالتخمين:** مشتقة المقام $1+x^2$ هي $2x$، والقاعدة $\int\frac{f'}{f}\,dx=\ln|f|$. نخمّن $\ln(1+x^2)$: مشتقته $\frac{2x}{1+x^2}$، ضعف اللي نبي، فنضرب في $\frac12$:
             $$\int\frac{x}{1+x^2}\,dx=\frac12\ln\big(1+x^2\big)$$
          5. و$1+x^2$ موجب دايم، فما يحتاج قيمة مطلقة. نجمع:
        answer: |-
          x\tan^{-1}x-\frac12\ln\big(1+x^2\big)+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'atan(x)'
          ans: 'x*atan(x) - log(1+x**2)/2'
          samples: [-2.0, 0.5, 3.0]

      - id: M471-2-5
        marks: 2
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int\sin^{-1}x\,dx'
        solution: |
          1. دالة عكسية لحالها: نشتق $\sin^{-1}x$ ونكامل الواحد، ونوقف في الصف الثاني:
             @di \sin^{-1}x & 1 ;; !\frac{1}{\sqrt{1-x^2}} & x
          2. القطر، ناقص تكامل ضرب الصف الأخير:
             $$x\sin^{-1}x-\int\frac{x}{\sqrt{1-x^2}}\,dx$$
          3. **الباقي بالتخمين:** تحت الجذر $1-x^2$، ومشتقته $-2x$. نخمّن $\sqrt{1-x^2}$ ونشتقه:
             $$\big(\sqrt{1-x^2}\big)'=\frac{-2x}{2\sqrt{1-x^2}}=\frac{-x}{\sqrt{1-x^2}}$$
          4. طلع اللي نبي بس بسالب، فـ $\int\frac{x}{\sqrt{1-x^2}}\,dx=-\sqrt{1-x^2}$. وناقص في ناقص يصير زائد:
        answer: |-
          x\sin^{-1}x+\sqrt{1-x^2}+C
        domain: '|x|<1'
        check:
          kind: indef
          f: 'asin(x)'
          ans: 'x*asin(x) + sqrt(1-x**2)'
          samples: [-0.8, 0.1, 0.7]

      - id: M451-2-5
        marks: 2
        page: 7
        prompt: 'Evaluate the integral.'
        q: '\int\cosh^{-1}x\,dx'
        solution: |
          1. نفس فكرة $\sin^{-1}$: نشتق $\cosh^{-1}x$ ونكامل الواحد:
             @di \cosh^{-1}x & 1 ;; !\frac{1}{\sqrt{x^2-1}} & x
          2. القطر، ناقص تكامل ضرب الصف الأخير:
             $$x\cosh^{-1}x-\int\frac{x}{\sqrt{x^2-1}}\,dx$$
          3. الباقي بالتخمين: نخمّن $\sqrt{x^2-1}$، ومشتقته $\frac{2x}{2\sqrt{x^2-1}}=\frac{x}{\sqrt{x^2-1}}$، بالضبط اللي نبي:
             $$\int\frac{x}{\sqrt{x^2-1}}\,dx=\sqrt{x^2-1}$$
        answer: |-
          x\cosh^{-1}x-\sqrt{x^2-1}+C
        domain: 'x>1'
        check:
          kind: indef
          f: 'acosh(x)'
          ans: 'x*acosh(x) - sqrt(x**2-1)'
          samples: [1.2, 2.0, 5.0]

      - id: M472-3-1
        marks: 1.5
        page: 21
        prompt: 'Evaluate the integral.'
        q: '\int x\,\sech^{-1}x\,dx'
        solution: |
          1. دالة عكسية × $x$: نشتق العكسية ونكامل $x$ (يصير $\frac{x^2}{2}$). مشتقة $\sech^{-1}x$ هي $\frac{-1}{x\sqrt{1-x^2}}$:
             @di \sech^{-1}x & x ;; !\frac{-1}{x\sqrt{1-x^2}} & \frac{x^2}{2}
          2. القطر، ناقص تكامل ضرب الصف الأخير. الضرب $\frac{x^2}{2}\cdot\frac{-1}{x\sqrt{1-x^2}}=-\frac12\cdot\frac{x}{\sqrt{1-x^2}}$، وناقص في ناقص يصير زائد:
             $$\frac{x^2}{2}\sech^{-1}x+\frac12\int\frac{x}{\sqrt{1-x^2}}\,dx$$
          3. الباقي نفس اللي في $\int\sin^{-1}x\,dx$ (M471-2-5): $\int\frac{x}{\sqrt{1-x^2}}\,dx=-\sqrt{1-x^2}$:
             $$\frac{x^2}{2}\sech^{-1}x+\frac12\big(-\sqrt{1-x^2}\big)$$
        answer: |-
          \frac{x^2}{2}\sech^{-1}x-\frac12\sqrt{1-x^2}+C
        domain: '0<x<1'
        check:
          kind: indef
          f: 'x*asech(x)'
          ans: 'x**2/2*asech(x) - sqrt(1-x**2)/2'
          samples: [0.1, 0.5, 0.9]
