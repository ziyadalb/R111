# القسم 5.2: التكاملات المثلثية (أسئلة الفصلي الثاني)
# الحلول بالقوة العكسية: ∫fⁿ·f′ dx = fⁿ⁺¹/(n+1)، بدون u وdu.
section: '5.2'
slug: s52
title: 'التكاملات المثلثية'
patterns:
  - key: D1
    title: 'sin و cos وفيه قوة فردية'
    questions:
      - id: M471-2-3
        marks: 2
        page: 6
        prompt: 'Evaluate the integral.'
        q: '\int\sin^2x\,\cos^5x\,dx'
        solution: |
          1. **وش النمط؟** $\sin$ و$\cos$ مضروبين، وقوة $\cos$ فردية (5).
          2. **نحجز $\cos x$ واحد.** ليش؟ لأنه مشتقة $\sin x$. إذا صار كل الباقي بـ $\sin$، يصير كل حد «$\sin$ أس شي × $\cos x$»، وهذا تكامله مباشر بالقوة العكسية:
             $$\cos^5x=\cos^4x\cdot\cos x=\big(\cos^2x\big)^2\cos x$$
          3. **نحوّل الباقي لـ $\sin$** بالمتطابقة $\cos^2x=1-\sin^2x$. والقوة الباقية زوجية (4)، وهذا اللي يخلي التحويل ممكن:
             $$\sin^2x\cos^5x=\sin^2x\big(1-\sin^2x\big)^2\cos x$$
          4. **نفك القوس:** المربع ما يتوزع، $(1-s)^2=1-2s+s^2$. بعدين نضرب في $\sin^2x$:
             $$=\big(\sin^2x-2\sin^4x+\sin^6x\big)\cos x$$
          5. **نكامل كل حد بالقوة العكسية:** $\int\sin^kx\cos x\,dx=\frac{\sin^{k+1}x}{k+1}$. نزيد الأس واحد ونقسم عليه، و$\cos x$ يروح:
             $$\frac{\sin^3x}{3}-\frac{2\sin^5x}{5}+\frac{\sin^7x}{7}$$
          6. **تأكد بسرعة:** اشتق $\frac{\sin^3x}{3}$، يطلع $\sin^2x\cos x$. يعني الحد الأول صح، والباقي بنفس الطريقة.
        answer: |-
          \frac{\sin^3x}{3}-\frac{2\sin^5x}{5}+\frac{\sin^7x}{7}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)**2*cos(x)**5'
          ans: 'sin(x)**3/3 - 2*sin(x)**5/5 + sin(x)**7/7'
          samples: [-1.0, 0.4, 2.0, 4.5]

      - id: M461-2-6
        marks: 2
        page: 7
        prompt: 'Evaluate the integral.'
        q: '\int\sin^4x\,\cos^5x\,dx'
        solution: |
          1. قوة $\cos$ فردية (5): نحجز $\cos x$، ونحوّل $\cos^4x=\big(1-\sin^2x\big)^2$:
             $$\sin^4x\cos^5x=\sin^4x\big(1-\sin^2x\big)^2\cos x$$
          2. نفك القوس ونضرب في $\sin^4x$:
             $$=\big(\sin^4x-2\sin^6x+\sin^8x\big)\cos x$$
          3. كل حد «$\sin$ أس شي × $\cos x$»: نزيد الأس ونقسم عليه:
             $$\frac{\sin^5x}{5}-\frac{2\sin^7x}{7}+\frac{\sin^9x}{9}$$
        answer: |-
          \frac{\sin^5x}{5}-\frac{2\sin^7x}{7}+\frac{\sin^9x}{9}+C
        domain: 'x\in\mathbb{R}'
        check:
          kind: indef
          f: 'sin(x)**4*cos(x)**5'
          ans: 'sin(x)**5/5 - 2*sin(x)**7/7 + sin(x)**9/9'
          samples: [-1.0, 0.4, 2.0, 4.5]

      - id: M451-2-4
        marks: 2
        page: 7
        prompt: 'Evaluate the integral.'
        q: '\int\sin^5x\,\cos^3x\,dx'
        solution: |
          1. القوتين فرديتين، فنقدر نحجز من أي وحدة. نحجز من **الأصغر** ($\cos^3x$)، عشان القوس اللي نفكه أصغر:
             $$\sin^5x\cos^3x=\sin^5x\cos^2x\cdot\cos x=\sin^5x\big(1-\sin^2x\big)\cos x$$
          2. نوزّع:
             $$=\big(\sin^5x-\sin^7x\big)\cos x$$
          3. القوة العكسية لكل حد:
             $$\frac{\sin^6x}{6}-\frac{\sin^8x}{8}$$
        answer: |-
          \frac{\sin^6x}{6}-\frac{\sin^8x}{8}+C
        domain: 'x\in\mathbb{R}'
        note: |
          لو حجزت $\sin x$ بداله، يطلع جواب بـ $\cos$ وشكله مختلف، والفرق بينهم ثابت. الاثنين صح، واخترنا $\cos$ بس عشان الفك أقصر.
        check:
          kind: indef
          f: 'sin(x)**5*cos(x)**3'
          ans: 'sin(x)**6/6 - sin(x)**8/8'
          samples: [-1.0, 0.4, 2.0, 4.5]

  - key: D2
    title: 'tan و sec (أو cot و csc)'
    questions:
      - id: M452-2-3
        marks: 2
        page: 23
        prompt: 'Evaluate the integral.'
        q: '\int\tan^2x\,\sec^4x\,dx'
        solution: |
          1. **وش النمط؟** $\tan$ و$\sec$ مضروبين، وقوة $\sec$ زوجية (4).
          2. **نحجز $\sec^2x$.** ليش؟ لأنه مشتقة $\tan x$. إذا صار الباقي كله بـ $\tan$، يصير كل حد «$\tan$ أس شي × $\sec^2x$»، وتكامله بالقوة العكسية:
             $$\sec^4x=\sec^2x\cdot\sec^2x$$
          3. **نحوّل الـ $\sec^2x$ الثاني لـ $\tan$** بالمتطابقة $\sec^2x=1+\tan^2x$، ونوزّع:
             $$\tan^2x\sec^4x=\tan^2x\big(1+\tan^2x\big)\sec^2x=\big(\tan^2x+\tan^4x\big)\sec^2x$$
          4. **القوة العكسية لكل حد:** $\int\tan^kx\sec^2x\,dx=\frac{\tan^{k+1}x}{k+1}$:
             $$\frac{\tan^3x}{3}+\frac{\tan^5x}{5}$$
        answer: |-
          \frac{\tan^3x}{3}+\frac{\tan^5x}{5}+C
        domain: '\cos x\ne0'
        check:
          kind: indef
          f: 'tan(x)**2*sec(x)**4'
          ans: 'tan(x)**3/3 + tan(x)**5/5'
          samples: [-1.0, 0.3, 1.2, 2.5]

      - id: M472-3-3
        marks: 1
        page: 21
        prompt: 'Evaluate the integral.'
        q: '\int\sec^3x\,\tan^3x\,dx'
        solution: |
          1. قوة $\sec$ فردية (3)، فلو حجزنا $\sec^2x$ يبقى $\sec x$ واحد ما يتحوّل لـ $\tan$. بس قوة $\tan$ فردية، فنحجز $\sec x\tan x$، لأنه مشتقة $\sec x$:
             $$\sec^3x\tan^3x=\sec^2x\tan^2x\cdot\big(\sec x\tan x\big)$$
          2. الباقي نبيه كله $\sec$: نحوّل $\tan^2x=\sec^2x-1$ ونوزّع:
             $$=\big(\sec^4x-\sec^2x\big)\big(\sec x\tan x\big)$$
          3. القوة العكسية: $\int\sec^kx\,\big(\sec x\tan x\big)\,dx=\frac{\sec^{k+1}x}{k+1}$:
             $$\frac{\sec^5x}{5}-\frac{\sec^3x}{3}$$
        answer: |-
          \frac{\sec^5x}{5}-\frac{\sec^3x}{3}+C
        domain: '\cos x\ne0'
        check:
          kind: indef
          f: 'sec(x)**3*tan(x)**3'
          ans: 'sec(x)**5/5 - sec(x)**3/3'
          samples: [-1.0, 0.3, 1.2, 2.5]

      - id: M462-2-4
        marks: 2
        page: 22
        prompt: 'Evaluate the integral.'
        q: '\int\cot^4x\,\csc^4x\,dx'
        solution: |
          1. $\cot$ و$\csc$ نفس فكرة $\tan$ و$\sec$. قوة $\csc$ زوجية، فنحجز $\csc^2x$، ونحوّل الباقي بـ $\csc^2x=1+\cot^2x$:
             $$\cot^4x\csc^4x=\cot^4x\big(1+\cot^2x\big)\csc^2x=\big(\cot^4x+\cot^6x\big)\csc^2x$$
          2. القوة العكسية، بس **بسالب**: مشتقة $\cot x$ هي $-\csc^2x$، فـ $\int\cot^kx\csc^2x\,dx=-\frac{\cot^{k+1}x}{k+1}$:
             $$-\frac{\cot^5x}{5}-\frac{\cot^7x}{7}$$
        answer: |-
          -\frac{\cot^5x}{5}-\frac{\cot^7x}{7}+C
        domain: '\sin x\ne0'
        check:
          kind: indef
          f: 'cot(x)**4*csc(x)**4'
          ans: '-cot(x)**5/5 - cot(x)**7/7'
          samples: [-1.0, 0.7, 2.0, 4.0]
