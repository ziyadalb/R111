# القسم 5.3 — التعويضات المثلثية
section: '5.3'
slug: s53
title: 'التعويضات المثلثية'
patterns:
  - key: E1
    title: '(a² − x²) أو (a² + x²) أُس 3/2 في المقام'
    questions:
      - id: M452-2-9
        marks: 3
        page: 25
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\big(4-x^2\big)^{3/2}}'
        hint: &h4m |
          تحت القوس $a^2-x^2$ مع $a=2$: عوّض بـ $\sin$.
          $$x=2\sin\theta$$
        solution: &s4m |
          1. تحت القوس $a^2-x^2$ مع $a=2$، فنعوّض بـ $\sin$ عشان نستفيد من $1-\sin^2\theta=\cos^2\theta$:
             $$x=2\sin\theta,\qquad dx=2\cos\theta\,d\theta$$
          2. نبسّط اللي تحت القوس: نطلّع 4 عامل مشترك ونستخدم الهوية:
             $$4-x^2=4-4\sin^2\theta=4\big(1-\sin^2\theta\big)=4\cos^2\theta$$
          3. القوة $\frac32$ يعني نجذر ونكعّب: $4^{3/2}=2^3=8$، و$(\cos^2\theta)^{3/2}=\cos^3\theta$ (لأن $\cos\theta>0$ لما $-\frac\pi2<\theta<\frac\pi2$):
             $$\big(4-x^2\big)^{3/2}=\big(4\cos^2\theta\big)^{3/2}=8\cos^3\theta$$
          4. نعوّض ونشطب $\cos\theta$:
             $$\int\frac{2\cos\theta\,d\theta}{8\cos^3\theta}=\frac14\int\frac{d\theta}{\cos^2\theta}=\frac14\int\sec^2\theta\,d\theta=\frac14\tan\theta+C$$
          5. نرجع لـ $x$ بالمثلث: $\sin\theta=\frac x2$ يعني المقابل $x$ والوتر 2، والمجاور من فيثاغورس. و$\tan\theta$ = المقابل على المجاور:
             @tri x|\sqrt{4-x^2}|2
             $$\tan\theta=\frac{x}{\sqrt{4-x^2}}$$
          6. نعوّض في $\frac14\tan\theta$:
        answer: &a4m |-
          \frac{x}{4\sqrt{4-x^2}}+C
        domain: '|x|<2'
        check:
          kind: indef
          f: '(4-x**2)**Rational(-3,2)'
          ans: 'x/(4*sqrt(4-x**2))'
          samples: [-1.5, 0.3, 1.8]

      - id: M472-3-5
        marks: 2
