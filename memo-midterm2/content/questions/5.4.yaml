# القسم 5.4: الكسور الجزئية (أسئلة الفصلي الثاني)
# الحلول بحيل: التغطية للعوامل الخطية، واختصار A=r/a² وB=p−A وD=q للمقام x(x²+a²)، وتكامل بدون u.
section: '5.4'
slug: s54
title: 'الكسور الجزئية'
patterns:
  - key: F1
    title: 'المقام x(x² + a²)'
    questions:
      - id: M472-3-6
        marks: 2
        page: 22
        prompt: 'Evaluate the integral.'
        q: '\int\frac{3x^2+x+4}{x\big(x^2+4\big)}\,dx'
        solution: |
          1. **وش النمط؟** درجة البسط (2) أقل من درجة المقام (3)، فما نحتاج قسمة. والمقام محلول: خطي ($x$) × تربيعي ما يتحلل ($x^2+4$، مجموع مربعين).
          2. **القالب:** فوق الخطي ثابت، وفوق التربيعي خطي ($Bx+D$). ليش خطي؟ لأن البسط فوق كل عامل لازم يكون أقل منه بدرجة:
             $$\frac{3x^2+x+4}{x\big(x^2+4\big)}=\frac Ax+\frac{Bx+D}{x^2+4}$$
          3. **نضرب في المقام** ونرتّب حسب قوى $x$:
             $$3x^2+x+4=A\big(x^2+4\big)+x\big(Bx+D\big)=(A+B)x^2+Dx+4A$$
          4. **نقارن المعاملات:** الثابت يعطي $A$، ومعامل $x$ يعطي $D$، ومعامل $x^2$ يعطي $B$. وهذا هو الاختصار $A=\frac{r}{a^2}$، $D=q$، $B=p-A$:
             $$4A=4\;\Rightarrow\;A=1,\qquad D=1,\qquad A+B=3\;\Rightarrow\;B=2$$
          5. **نفصل الكسر الثاني لجزأين**، لأن كل جزء له تكامل مختلف:
             $$\int\Big(\frac1x+\frac{2x}{x^2+4}+\frac{1}{x^2+4}\Big)dx$$
          6. **نكامل بدون $u$:** الأول $\ln$. والثاني بسطه مشتقة مقامه بالضبط، و$\int\frac{f'}{f}=\ln|f|$. والثالث قانون $\tan^{-1}$ مع $a=2$:
             $$\ln|x|+\ln\big(x^2+4\big)+\frac12\tan^{-1}\frac x2$$
        answer: |-
          \ln|x|+\ln\big(x^2+4\big)+\frac12\tan^{-1}\Big(\frac x2\Big)+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: '(3*x**2+x+4)/(x*(x**2+4))'
          ans: 'log(Abs(x)) + log(x**2+4) + atan(x/2)/2'
          samples: [-3.0, -0.5, 0.5, 3.0]
          identities:
            - ['(3*x**2+x+4)/(x*(x**2+4))', '1/x + (2*x+1)/(x**2+4)']

      - id: M462-2-9
        marks: 3
        page: 24
        prompt: 'Evaluate the integral.'
        q: '\int\frac{x^2+x+9}{x^3+9x}\,dx'
        solution: |
          1. نحلّل المقام: $x$ عامل مشترك، فيصير نفس نمط M472-3-6 مع $a^2=9$:
             $$\frac{x^2+x+9}{x\big(x^2+9\big)}=\frac Ax+\frac{Bx+D}{x^2+9}$$
          2. نضرب في المقام ونقارن، أو بالاختصار مباشرة ($A=\frac99$، $D=1$، $B=1-A$):
             $$x^2+x+9=(A+B)x^2+Dx+9A\;\Rightarrow\;A=1,\;D=1,\;B=0$$
          3. $B=0$ يعني ما فيه حد $\ln(x^2+9)$. نكامل، والثاني $\tan^{-1}$ مع $a=3$:
             $$\int\Big(\frac1x+\frac{1}{x^2+9}\Big)dx=\ln|x|+\frac13\tan^{-1}\frac x3$$
        answer: |-
          \ln|x|+\frac13\tan^{-1}\Big(\frac x3\Big)+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: '(x**2+x+9)/(x**3+9*x)'
          ans: 'log(Abs(x)) + atan(x/3)/3'
          samples: [-3.0, -0.5, 0.5, 3.0]
          identities:
            - ['(x**2+x+9)/(x**3+9*x)', '1/x + 1/(x**2+9)']

      - id: M452-2-8
        marks: 3
        page: 24
        prompt: 'Evaluate the integral.'
        q: '\int\frac{3x^2+3x+8}{x^3+4x}\,dx'
        solution: |
          1. نحلّل المقام: $x^3+4x=x\big(x^2+4\big)$، والقالب نفسه:
             $$\frac{3x^2+3x+8}{x\big(x^2+4\big)}=\frac Ax+\frac{Bx+D}{x^2+4}$$
          2. نضرب ونقارن، أو بالاختصار ($A=\frac84$، $D=3$، $B=3-A$):
             $$3x^2+3x+8=(A+B)x^2+Dx+4A\;\Rightarrow\;A=2,\;D=3,\;B=1$$
          3. نفصل ونكامل. $\frac{x}{x^2+4}$ ينقصه 2 عشان يصير مشتقة المقام، فنضرب في $\frac12$:
             $$\int\Big(\frac2x+\frac{x}{x^2+4}+\frac{3}{x^2+4}\Big)dx=2\ln|x|+\frac12\ln\big(x^2+4\big)+\frac32\tan^{-1}\frac x2$$
        answer: |-
          2\ln|x|+\frac12\ln\big(x^2+4\big)+\frac32\tan^{-1}\Big(\frac x2\Big)+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: '(3*x**2+3*x+8)/(x**3+4*x)'
          ans: '2*log(Abs(x)) + log(x**2+4)/2 + 3*atan(x/2)/2'
          samples: [-3.0, -0.5, 0.5, 3.0]
          identities:
            - ['(3*x**2+3*x+8)/(x**3+4*x)', '2/x + (x+3)/(x**2+4)']

      - id: M461-2-8
        marks: 3
        page: 8
        prompt: 'Evaluate the integral.'
        q: '\int\frac{5x^2+x+8}{x^3+4x}\,dx'
        solution: |
          1. نحلّل المقام: $x^3+4x=x\big(x^2+4\big)$، والقالب نفسه:
             $$\frac{5x^2+x+8}{x\big(x^2+4\big)}=\frac Ax+\frac{Bx+D}{x^2+4}$$
          2. نضرب ونقارن، أو بالاختصار ($A=\frac84$، $D=1$، $B=5-A$):
             $$5x^2+x+8=(A+B)x^2+Dx+4A\;\Rightarrow\;A=2,\;D=1,\;B=3$$
          3. نفصل ونكامل. $\frac{3x}{x^2+4}$ نكتبه $\frac32\cdot\frac{2x}{x^2+4}$ عشان تطلع مشتقة المقام:
             $$\int\Big(\frac2x+\frac{3x}{x^2+4}+\frac{1}{x^2+4}\Big)dx=2\ln|x|+\frac32\ln\big(x^2+4\big)+\frac12\tan^{-1}\frac x2$$
        answer: |-
          2\ln|x|+\frac32\ln\big(x^2+4\big)+\frac12\tan^{-1}\Big(\frac x2\Big)+C
        domain: 'x\ne0'
        note: |
          في سطر وسطي من المفتاح مكتوب $2+B=0$، والصحيح $2+B=5$. الجواب النهائي في المفتاح صحيح.
        check:
          kind: indef
          f: '(5*x**2+x+8)/(x**3+4*x)'
          ans: '2*log(Abs(x)) + 3*log(x**2+4)/2 + atan(x/2)/2'
          samples: [-3.0, -0.5, 0.5, 3.0]
          identities:
            - ['(5*x**2+x+8)/(x**3+4*x)', '2/x + (3*x+1)/(x**2+4)']

      - id: M451-2-8
        marks: 3
        page: 8
        prompt: 'Evaluate the integral.'
        q: '\int\frac{x+3}{x^3+9x}\,dx'
        solution: |
          1. نحلّل المقام: $x^3+9x=x\big(x^2+9\big)$. وما فيه $x^2$ في البسط، يعني $p=0$:
             $$\frac{x+3}{x\big(x^2+9\big)}=\frac Ax+\frac{Bx+D}{x^2+9}$$
          2. نضرب ونقارن، أو بالاختصار ($A=\frac39$، $D=1$، $B=0-A$):
             $$x+3=(A+B)x^2+Dx+9A\;\Rightarrow\;A=\frac13,\;D=1,\;B=-\frac13$$
          3. نفصل الكسور:
             $$\int\Big(\frac{1}{3x}-\frac13\cdot\frac{x}{x^2+9}+\frac{1}{x^2+9}\Big)dx$$
          4. الأوسط: $\int\frac{x}{x^2+9}dx=\frac12\ln(x^2+9)$، و$\frac13\cdot\frac12=\frac16$. والأخير $\tan^{-1}$ مع $a=3$:
             $$\frac13\ln|x|-\frac16\ln\big(x^2+9\big)+\frac13\tan^{-1}\frac x3$$
        answer: |-
          \frac13\ln|x|-\frac16\ln\big(x^2+9\big)+\frac13\tan^{-1}\Big(\frac x3\Big)+C
        domain: 'x\ne0'
        check:
          kind: indef
          f: '(x+3)/(x**3+9*x)'
          ans: 'log(Abs(x))/3 - log(x**2+9)/6 + atan(x/3)/3'
          samples: [-3.0, -0.5, 0.5, 3.0]
          identities:
            - ['(x+3)/(x**3+9*x)', '1/(3*x) + (-x/3+1)/(x**2+9)']

  - key: F2
    title: 'عامل مكرر x² مع x² + 1'
    questions:
      - id: M471-2-8
        marks: 3
        page: 7
        prompt: 'Evaluate the integral.'
        q: '\int\frac{2x+1}{x^2\big(1+x^2\big)}\,dx'
        solution: |
          1. **وش النمط؟** المقام فيه $x$ مكرر مرتين ($x^2$). والعامل المكرر يبي حد لكل قوة: $\frac Ax$ و$\frac B{x^2}$. وفوق $1+x^2$ خطي:
             $$\frac{2x+1}{x^2\big(1+x^2\big)}=\frac Ax+\frac B{x^2}+\frac{Dx+E}{1+x^2}$$
          2. **$B$ بالتغطية:** غطّ $x^2$ وعوّض $x=0$ في الباقي. ليش تنفع؟ لو ضربنا الطرفين في $x^2$ وحطينا $x=0$، كل الحدود تصير صفر إلا $B$:
             $$B=\frac{2(0)+1}{1+0^2}=1$$
          3. **الباقي بالمقارنة:** نضرب في المقام ونرتّب حسب القوى:
             $$2x+1=(A+D)x^3+(B+E)x^2+Ax+B$$
          4. معامل $x$ يعطي $A$ مباشرة، ومعامل $x^3$ ومعامل $x^2$ يعطون الباقي:
             $$A=2,\qquad A+D=0\;\Rightarrow\;D=-2,\qquad B+E=0\;\Rightarrow\;E=-1$$
          5. نكتب الكسور ونفصل:
             $$\int\Big(\frac2x+\frac1{x^2}-\frac{2x}{1+x^2}-\frac1{1+x^2}\Big)dx$$
          6. **نكامل بدون $u$:** $\frac1{x^2}=x^{-2}$ تكاملها $-\frac1x$ (القوة العكسية). و$\frac{2x}{1+x^2}$ بسطها مشتقة مقامها. والأخير $\tan^{-1}$:
             $$2\ln|x|-\frac1x-\ln\big(1+x^2\big)-\tan^{-1}x$$
        answer: |-
          2\ln|x|-\frac1x-\ln\big(1+x^2\big)-\tan^{-1}x+C
        domain: 'x\ne0'
        trick: |
          الفرق بين العاملين رقم: $(1+x^2)-x^2=1$. فتقدر تكتب $\frac{1}{x^2(1+x^2)}=\frac1{x^2}-\frac1{1+x^2}$ على طول، وتضربه في $2x+1$:
          $$\frac{2x+1}{x^2}-\frac{2x+1}{1+x^2}=\frac2x+\frac1{x^2}-\frac{2x}{1+x^2}-\frac1{1+x^2}$$
          ونفس الكسور طلعت بدون معادلات.
        check:
          kind: indef
          f: '(2*x+1)/(x**2*(1+x**2))'
          ans: '2*log(Abs(x)) - 1/x - log(1+x**2) - atan(x)'
          samples: [-3.0, -0.5, 0.5, 3.0]
          identities:
            - ['(2*x+1)/(x**2*(1+x**2))', '2/x + 1/x**2 + (-2*x-1)/(1+x**2)']
            - ['1/(x**2*(1+x**2))', '1/x**2 - 1/(1+x**2)']
