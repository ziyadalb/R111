      - id: M471-2-9
        marks: 2
        page: 8
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{x^{1/2}+x^{2/3}}'
        solution: |
          1. مقامات الأسس 2 و3، والمضاعف المشترك الأصغر 6 (مو 3: لازم يقبل القسمة على الاثنين):
             $$x=t^6,\qquad dx=6t^5\,dt,\qquad x^{1/2}=t^3,\qquad x^{2/3}=t^4$$
          2. نعوّض، ونطلّع أصغر قوة ($t^3$) عامل مشترك ونشطبها:
             $$\int\frac{6t^5\,dt}{t^3+t^4}=6\int\frac{t^2}{t+1}\,dt$$
          3. نفس القسمة المتناوبة:
             $$\frac{t^2}{t+1}=t-1+\frac{1}{t+1}$$
          4. نكامل:
             $$6\Big(\frac{t^2}{2}-t+\ln(t+1)\Big)=3t^2-6t+6\ln(t+1)$$
          5. نرجع: $t=x^{1/6}$، و$t^2=x^{2/6}=x^{1/3}$ (بسّط الكسر):
        answer: |-
          3x^{1/3}-6x^{1/6}+6\ln\big(1+x^{1/6}\big)+C
        domain: 'x>0'
        check:
          kind: indef
          f: '1/(sqrt(x)+x**Rational(2,3))'
          ans: '3*x**Rational(1,3) - 6*x**Rational(1,6) + 6*log(1+x**Rational(1,6))'
          samples: [0.2, 1.0, 5.0]
          identities:
            - ['6*x**5/(x**3+x**4)', '6*x**2/(x+1)']

  - key: G2
    title: 'جذر داخل جذر'
    questions:
      - id: M452-2-6
        marks: 2
        page: 24
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{4+\sqrt{x}}}'
        solution: |
          1. **وش النمط؟** جذر فوقه جذر، وما فيه مشتقة جاهزة ($\frac{1}{2\sqrt x}$ مو موجودة). لو بدّلنا $\sqrt x$ بس، يبقى جذر ثاني. فنبدّل **الجذر الخارجي كله**، لأنه يشيل الجذرين مرة وحدة:
             $$t=\sqrt{4+\sqrt x}$$
          2. **نطلّع $x$ بدلالة $t$:** نربّع، ونعزل $\sqrt x$، ونربّع مرة ثانية:
             $$t^2=4+\sqrt x\;\Rightarrow\;\sqrt x=t^2-4\;\Rightarrow\;x=\big(t^2-4\big)^2$$
          3. **$dx$ بقاعدة السلسلة:** مشتقة القوس × مشتقة اللي داخله:
             $$dx=2\big(t^2-4\big)\cdot2t\,dt=4t\big(t^2-4\big)dt$$
          4. **نعوّض:** الجذر كله صار $t$، ونشطب $t$ لأنه عامل فوق وتحت:
             $$\int\frac{4t\big(t^2-4\big)}{t}\,dt=4\int\big(t^2-4\big)dt=\frac43t^3-16t$$
          5. **نرجع لـ $x$:** $t=\sqrt{4+\sqrt x}$، و$t^3=\big(4+\sqrt x\big)^{3/2}$:
        answer: |-
          \frac43\big(4+\sqrt{x}\big)^{3/2}-16\sqrt{4+\sqrt{x}}+C
        domain: 'x>0'
        check:
          kind: indef
          f: '1/sqrt(4+sqrt(x))'
          ans: 'Rational(4,3)*(4+sqrt(x))**Rational(3,2) - 16*sqrt(4+sqrt(x))'
          samples: [0.3, 2.0, 9.0]
