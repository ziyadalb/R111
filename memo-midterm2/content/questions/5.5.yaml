# القسم 5.5: تعويضات متنوعة (أسئلة الفصلي الثاني)
# الحلول بوصفة ثابتة بحرف t (المفاتيح تكتب u، نفس الشي)، وبعد التبديل حيل بدون u: القسمة المتناوبة، والقوة العكسية، و f′/f.
section: '5.5'
slug: s55
title: 'تعويضات متنوعة'
patterns:
  - key: G1
    title: 'أسس كسرية في المقام'
    questions:
      - id: M472-3-7
        marks: 1.5
        page: 23
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{x^{1/2}+x^{3/4}}'
        solution: |
          1. **وش النمط؟** في المقام قوى كسرية لـ $x$ ($x^{1/2}$ و$x^{3/4}$)، وما فيه مشتقة جاهزة جنبها. فنبدّل المتغير بحيث كل الأسس تصير أعداد صحيحة.
          2. **نختار $n$:** مقامات الأسس 2 و4، والمضاعف المشترك الأصغر 4. ليش 4؟ لأن $\frac12\times4$ و$\frac34\times4$ أعداد صحيحة. فنحط $x=t^4$ (يعني $t=x^{1/4}>0$):
             $$x=t^4,\qquad dx=4t^3\,dt,\qquad x^{1/2}=t^2,\qquad x^{3/4}=t^3$$
          3. **نعوّض كل شي**، و$dx$ معه:
             $$\int\frac{dx}{x^{1/2}+x^{3/4}}=\int\frac{4t^3\,dt}{t^2+t^3}$$
          4. **نطلّع أصغر قوة ($t^2$) عامل مشترك من المقام**، ونشطبها مع اللي فوق. نشطب عوامل بس، مو حدود جمع:
             $$\frac{4t^3}{t^2(1+t)}=\frac{4t}{t+1}$$
          5. **القسمة المتناوبة:** البسط $t$ نكتبه «المقام ناقص 1»، فينقسم الكسر لحدين سهلين:
             $$\frac{t}{t+1}=\frac{(t+1)-1}{t+1}=1-\frac{1}{t+1}$$
          6. **نكامل.** و$t+1>0$ لأن $t>0$، فما نحتاج قيمة مطلقة:
             $$4\int\Big(1-\frac{1}{t+1}\Big)dt=4t-4\ln(t+1)$$
          7. **نرجع لـ $x$** بـ $t=x^{1/4}$:
        answer: |-
          4x^{1/4}-4\ln\big(1+x^{1/4}\big)+C
        domain: 'x>0'
        check:
          kind: indef
          f: '1/(sqrt(x)+x**Rational(3,4))'
          ans: '4*x**Rational(1,4) - 4*log(1+x**Rational(1,4))'
          samples: [0.2, 1.0, 5.0]
          identities:
            - ['4*x**3/(x**2+x**3)', '4*x/(x+1)']
            - ['x/(x+1)', '1-1/(x+1)']

      - id: M451-2-9
        marks: 2
        page: 9
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt[4]{x}+\sqrt{x}}'
        solution: &s49 |
          1. $\sqrt[4]{x}=x^{1/4}$ و$\sqrt x=x^{1/2}$. المقامات 4 و2، والمضاعف المشترك 4:
             $$x=t^4,\qquad dx=4t^3\,dt,\qquad\sqrt[4]x=t,\qquad\sqrt x=t^2$$
          2. نعوّض، ونطلّع أصغر قوة ($t$) عامل مشترك ونشطبها:
             $$\int\frac{4t^3\,dt}{t+t^2}=4\int\frac{t^2}{t+1}\,dt$$
          3. القسمة المتناوبة (تتأكد بالضرب: $(t+1)(t-1)+1=t^2$):
             $$\frac{t^2}{t+1}=t-1+\frac{1}{t+1}$$
          4. نكامل:
             $$4\Big(\frac{t^2}{2}-t+\ln(t+1)\Big)=2t^2-4t+4\ln(t+1)$$
          5. نرجع: $t=\sqrt[4]x$، و$t^2=\sqrt x$:
        answer: &a49 |-
          2\sqrt{x}-4\sqrt[4]{x}+4\ln\big(1+\sqrt[4]{x}\big)+C
        domain: 'x>0'
        note: |
          في سطر وسطي من المفتاح مكتوب $\ln|u-1|$، والصحيح $\ln|u+1|$. الجواب النهائي في المفتاح صحيح.
        check:
          kind: indef
          f: '1/(x**Rational(1,4)+sqrt(x))'
          ans: '2*sqrt(x) - 4*x**Rational(1,4) + 4*log(1+x**Rational(1,4))'
          samples: [0.2, 1.0, 5.0]
          identities:
            - ['x**2/(x+1)', 'x-1+1/(x+1)']

