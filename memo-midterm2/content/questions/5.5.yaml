      - id: M471-2-9
        marks: 2
        page: 8
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{x^{1/2}+x^{2/3}}'
        hint: |
          مقامات الأسس 2 و3: المضاعف المشترك الأصغر 6.
          $$x=u^6$$
        solution: |
          1. مقامات الأسس 2 و3، والمضاعف المشترك الأصغر 6. فنعوّض (و$u>0$):
             $$x=u^6,\qquad dx=6u^5\,du$$
             $$x^{1/2}=\big(u^6\big)^{1/2}=u^3,\qquad x^{2/3}=\big(u^6\big)^{2/3}=u^4$$
          2. نعوّض، ونطلّع $u^3$ عامل مشترك ونشطبه:
             $$\int\frac{6u^5\,du}{u^3+u^4}=\int\frac{6u^5}{u^3(1+u)}\,du=6\int\frac{u^2}{u+1}\,du$$
          3. نفس حركة البسط:
             $$\frac{u^2}{u+1}=u-1+\frac{1}{u+1}$$
          4. نكامل:
             $$6\int\Big(u-1+\frac{1}{u+1}\Big)du=3u^2-6u+6\ln(u+1)+C$$
          5. نرجع: $u=x^{1/6}$، و$u^2=x^{2/6}=x^{1/3}$:
        answer: |-
          3x^{1/3}-6x^{1/6}+6\ln\big(1+x^{1/6}\big)+C
        domain: 'x>0'
        check:
          kind: indef
          f: '1/(sqrt(x)+x**Rational(2,3))'
          ans: '3*x**Rational(1,3) - 6*x**Rational(1,6) + 6*log(1+x**Rational(1,6))'
          samples: [0.2, 1.0, 5.0]
          identities:
            - ['6*x**5/(x**3+x**4)', '6*x**2/(x+1)']

  - key: G2
    title: 'جذر داخل جذر'
    questions:
      - id: M452-2-6
        marks: 2
        page: 24
        prompt: 'Evaluate the integral.'
        q: '\int\frac{dx}{\sqrt{4+\sqrt{x}}}'
        hint: |
          عوّض الجذر الخارجي كله:
          $$u=\sqrt{4+\sqrt x}$$
          وطلّع $x$ بدلالة $u$.
        solution: |
          1. نعوّض الجذر الخارجي كله، لأنه يشيل الجذرين مرة وحدة:
             $$u=\sqrt{4+\sqrt x}$$
          2. نطلّع $x$ بدلالة $u$: نربّع، ثم نعزل $\sqrt x$، ثم نربّع مرة ثانية:
             $$u^2=4+\sqrt x\quad\Rightarrow\quad\sqrt x=u^2-4\quad\Rightarrow\quad x=\big(u^2-4\big)^2$$
          3. نشتق (قاعدة السلسلة: مشتقة القوس × مشتقة اللي داخله):
             $$dx=2\big(u^2-4\big)\cdot2u\,du=4u\big(u^2-4\big)du$$
          4. نعوّض، ونشطب $u$ لأنه عامل فوق وتحت:
             $$\int\frac{dx}{\sqrt{4+\sqrt x}}=\int\frac{4u\big(u^2-4\big)}{u}\,du=4\int\big(u^2-4\big)du$$
          5. نكامل:
             $$=\frac43u^3-16u+C$$
          6. نرجع لـ $x$:
        answer: |-
          \frac43\big(4+\sqrt{x}\big)^{3/2}-16\sqrt{4+\sqrt{x}}+C
        domain: 'x>0'
        check:
          kind: indef
          f: '1/sqrt(4+sqrt(x))'
          ans: 'Rational(4,3)*(4+sqrt(x))**Rational(3,2) - 16*sqrt(4+sqrt(x))'
          samples: [0.3, 2.0, 9.0]
